<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relook - Ресейл площадка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
--bg: #0a0a0a;
--bg-secondary: #111111;
--bg-tertiary: #1a1a1a;
--bg-card: #1e1e1e;
--bg-input: #252525;
--accent: #10b981;
--accent-hover: #059669;
--accent-glow: rgba(16, 185, 129, 0.3);
--text-primary: #ffffff;
--text-secondary: #a0a0a0;
--text-muted: #666666;
--border: #2a2a2a;
--danger: #ef4444;
--warning: #f59e0b;
--success: #10b981;
--gold: #fbbf24;
--premium-gradient: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c);
--sidebar-width: 260px;
--header-height: 60px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
font-family: 'Inter', sans-serif;
background: var(--bg);
color: var(--text-primary);
min-height: 100vh;
overflow-x: hidden;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
button {
cursor: pointer;
font-family: inherit;
border: none;
outline: none;
transition: all 0.2s;
}
input, textarea, select {
font-family: inherit;
outline: none;
border: 1px solid var(--border);
background: var(--bg-input);
color: var(--text-primary);
padding: 12px 16px;
border-radius: 10px;
font-size: 14px;
width: 100%;
transition: border-color 0.2s;
}
input:focus, textarea:focus, select:focus {
border-color: var(--accent);
}
textarea { resize: vertical; min-height: 100px; }
.hidden { display: none !important; }

/* Auth Screen */
#authScreen {
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: var(--bg);
background-image: radial-gradient(ellipse at top, rgba(16,185,129,0.08) 0%, transparent 60%);
}
.auth-container {
width: 100%;
max-width: 440px;
padding: 20px;
}
.auth-logo {
text-align: center;
margin-bottom: 40px;
}
.auth-logo h1 {
font-size: 42px;
font-weight: 900;
background: linear-gradient(135deg, var(--accent), #34d399);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
letter-spacing: -1px;
}
.auth-logo p {
color: var(--text-secondary);
margin-top: 8px;
font-size: 14px;
}
.auth-tabs {
display: flex;
background: var(--bg-secondary);
border-radius: 12px;
padding: 4px;
margin-bottom: 30px;
}
.auth-tab {
flex: 1;
padding: 12px;
text-align: center;
border-radius: 10px;
font-weight: 600;
font-size: 14px;
color: var(--text-secondary);
background: transparent;
transition: all 0.3s;
}
.auth-tab.active {
background: var(--accent);
color: #fff;
}
.auth-form {
background: var(--bg-secondary);
border-radius: 16px;
padding: 32px;
border: 1px solid var(--border);
}
.auth-form h2 {
font-size: 22px;
margin-bottom: 8px;
}
.auth-form .subtitle {
color: var(--text-secondary);
font-size: 13px;
margin-bottom: 24px;
}
.form-group {
margin-bottom: 18px;
}
.form-group label {
display: block;
font-size: 13px;
font-weight: 500;
color: var(--text-secondary);
margin-bottom: 6px;
}
.auth-btn {
width: 100%;
padding: 14px;
background: var(--accent);
color: #fff;
font-weight: 600;
font-size: 15px;
border-radius: 10px;
margin-top: 10px;
}
.auth-btn:hover {
background: var(--accent-hover);
transform: translateY(-1px);
}
.auth-btn:disabled {
opacity: 0.5;
cursor: not-allowed;
transform: none;
}
.step-indicator {
display: flex;
justify-content: center;
gap: 8px;
margin-bottom: 24px;
}
.step-dot {
width: 8px;
height: 8px;
border-radius: 50%;
background: var(--border);
transition: all 0.3s;
}
.step-dot.active {
background: var(--accent);
width: 24px;
border-radius: 4px;
}
.step-dot.done {
background: var(--accent-hover);
}
.verification-box {
text-align: center;
padding: 20px 0;
}
.verification-box .icon {
font-size: 48px;
margin-bottom: 16px;
}
.verification-box p {
color: var(--text-secondary);
font-size: 14px;
line-height: 1.6;
margin-bottom: 12px;
}
.verification-box .email-highlight {
color: var(--accent);
font-weight: 600;
}
.verify-btn {
padding: 12px 32px;
background: var(--accent);
color: #fff;
border-radius: 10px;
font-weight: 600;
font-size: 14px;
margin-top: 16px;
}
.verify-btn:disabled {
opacity: 0.4;
cursor: not-allowed;
}
.rules-modal {
background: var(--bg-secondary);
border-radius: 16px;
padding: 32px;
border: 1px solid var(--border);
max-height: 70vh;
overflow-y: auto;
}
.rules-modal h2 {
font-size: 20px;
margin-bottom: 20px;
color: var(--accent);
}
.rules-modal h3 {
font-size: 15px;
margin: 16px 0 8px;
color: var(--text-primary);
}
.rules-modal p, .rules-modal li {
font-size: 13px;
color: var(--text-secondary);
line-height: 1.6;
}
.rules-modal ul {
padding-left: 20px;
margin-bottom: 12px;
}
.rules-checkbox {
display: flex;
align-items: flex-start;
gap: 10px;
margin-top: 24px;
padding: 16px;
background: var(--bg-tertiary);
border-radius: 10px;
cursor: pointer;
}
.rules-checkbox input[type="checkbox"] {
width: 18px;
height: 18px;
accent-color: var(--accent);
flex-shrink: 0;
margin-top: 2px;
}
.rules-checkbox span {
font-size: 13px;
color: var(--text-secondary);
line-height: 1.5;
}

/* Main Layout */
#mainApp {
display: none;
min-height: 100vh;
}
.app-layout {
display: flex;
min-height: 100vh;
}
.sidebar {
width: var(--sidebar-width);
background: var(--bg-secondary);
border-right: 1px solid var(--border);
display: flex;
flex-direction: column;
position: fixed;
top: 0;
left: 0;
height: 100vh;
z-index: 100;
transition: transform 0.3s;
}
.sidebar-header {
padding: 20px;
border-bottom: 1px solid var(--border);
}
.sidebar-header h2 {
font-size: 24px;
font-weight: 900;
background: linear-gradient(135deg, var(--accent), #34d399);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
.sidebar-nav {
flex: 1;
padding: 12px;
overflow-y: auto;
}
.nav-item {
display: flex;
align-items: center;
gap: 12px;
padding: 12px 16px;
border-radius: 10px;
color: var(--text-secondary);
font-size: 14px;
font-weight: 500;
background: transparent;
width: 100%;
text-align: left;
margin-bottom: 4px;
}
.nav-item:hover {
background: var(--bg-tertiary);
color: var(--text-primary);
}
.nav-item.active {
background: rgba(16,185,129,0.1);
color: var(--accent);
}
.nav-item svg {
width: 20px;
height: 20px;
flex-shrink: 0;
}
.nav-item.admin-btn {
color: var(--danger);
margin-top: 12px;
border-top: 1px solid var(--border);
padding-top: 16px;
}
.nav-item.admin-btn:hover {
background: rgba(239,68,68,0.1);
color: var(--danger);
}
.sidebar-footer {
padding: 16px;
border-top: 1px solid var(--border);
}
.sidebar-user {
display: flex;
align-items: center;
gap: 10px;
}
.sidebar-user-avatar {
width: 36px;
height: 36px;
border-radius: 50%;
background: var(--bg-tertiary);
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
flex-shrink: 0;
}
.sidebar-user-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
}
.sidebar-user-info {
overflow: hidden;
}
.sidebar-user-info .name {
font-size: 13px;
font-weight: 600;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.sidebar-user-info .plan {
font-size: 11px;
color: var(--text-muted);
}
.main-content {
flex: 1;
margin-left: var(--sidebar-width);
min-height: 100vh;
}
.main-header {
height: var(--header-height);
background: var(--bg-secondary);
border-bottom: 1px solid var(--border);
display: flex;
align-items: center;
justify-content: space-between;
padding: 0 24px;
position: sticky;
top: 0;
z-index: 50;
}
.main-header h1 {
font-size: 18px;
font-weight: 700;
}
.header-actions {
display: flex;
align-items: center;
gap: 12px;
}
.header-btn {
padding: 8px 16px;
background: var(--accent);
color: #fff;
border-radius: 8px;
font-size: 13px;
font-weight: 600;
display: flex;
align-items: center;
gap: 6px;
}
.header-btn:hover {
background: var(--accent-hover);
}
.page-content {
padding: 24px;
}

/* Listings Grid */
.listings-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
gap: 20px;
}
.listing-card {
background: var(--bg-card);
border-radius: 12px;
overflow: hidden;
border: 1px solid var(--border);
cursor: pointer;
transition: all 0.3s;
}
.listing-card:hover {
transform: translateY(-4px);
border-color: var(--accent);
box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.listing-card-img {
width: 100%;
height: 200px;
object-fit: cover;
background: var(--bg-tertiary);
}
.listing-card-body {
padding: 14px;
}
.listing-card-price {
font-size: 18px;
font-weight: 700;
color: var(--accent);
margin-bottom: 4px;
}
.listing-card-title {
font-size: 14px;
font-weight: 500;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
margin-bottom: 6px;
}
.listing-card-meta {
display: flex;
align-items: center;
justify-content: space-between;
font-size: 12px;
color: var(--text-muted);
}
.original-badge {
display: inline-flex;
align-items: center;
gap: 4px;
background: rgba(16,185,129,0.15);
color: var(--accent);
padding: 2px 8px;
border-radius: 4px;
font-size: 11px;
font-weight: 600;
}

/* Listing Detail */
.listing-detail {
max-width: 900px;
margin: 0 auto;
}
.listing-gallery {
display: flex;
gap: 12px;
margin-bottom: 24px;
overflow-x: auto;
padding-bottom: 8px;
}
.listing-gallery-main {
width: 100%;
max-width: 500px;
height: 400px;
object-fit: cover;
border-radius: 12px;
background: var(--bg-tertiary);
}
.listing-gallery-thumb {
width: 80px;
height: 80px;
object-fit: cover;
border-radius: 8px;
cursor: pointer;
border: 2px solid transparent;
transition: all 0.2s;
flex-shrink: 0;
}
.listing-gallery-thumb.active {
border-color: var(--accent);
}
.listing-info {
display: grid;
grid-template-columns: 1fr 300px;
gap: 32px;
}
.listing-details h1 {
font-size: 24px;
font-weight: 700;
margin-bottom: 8px;
}
.listing-details .price {
font-size: 28px;
font-weight: 800;
color: var(--accent);
margin-bottom: 20px;
}
.detail-row {
display: flex;
justify-content: space-between;
padding: 10px 0;
border-bottom: 1px solid var(--border);
font-size: 14px;
}
.detail-row .label {
color: var(--text-secondary);
}
.detail-row .value {
font-weight: 500;
}
.description-block {
margin-top: 20px;
padding: 16px;
background: var(--bg-tertiary);
border-radius: 10px;
font-size: 14px;
color: var(--text-secondary);
line-height: 1.6;
}
.seller-card {
background: var(--bg-card);
border-radius: 12px;
padding: 20px;
border: 1px solid var(--border);
position: sticky;
top: 80px;
}
.seller-card-header {
display: flex;
align-items: center;
gap: 12px;
margin-bottom: 16px;
}
.seller-avatar {
width: 48px;
height: 48px;
border-radius: 50%;
background: var(--bg-tertiary);
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
font-size: 20px;
flex-shrink: 0;
}
.seller-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
}
.seller-name {
font-weight: 600;
font-size: 15px;
}
.seller-rating {
display: flex;
align-items: center;
gap: 4px;
font-size: 12px;
color: var(--gold);
}
.seller-plan-badge {
display: inline-block;
padding: 2px 8px;
border-radius: 4px;
font-size: 11px;
font-weight: 600;
margin-top: 4px;
}
.seller-plan-badge.free { background: #333; color: #999; }
.seller-plan-badge.replus { background: rgba(251,191,36,0.15); color: var(--gold); }
.seller-plan-badge.repremium { background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(240,147,251,0.2)); color: #f093fb; }
.write-btn {
width: 100%;
padding: 12px;
background: var(--accent);
color: #fff;
border-radius: 10px;
font-weight: 600;
font-size: 14px;
margin-top: 16px;
}
.write-btn:hover {
background: var(--accent-hover);
}

/* Chat */
.chat-container {
display: flex;
height: calc(100vh - var(--header-height));
}
.chat-list {
width: 300px;
background: var(--bg-secondary);
border-right: 1px solid var(--border);
overflow-y: auto;
}
.chat-list-header {
padding: 16px;
border-bottom: 1px solid var(--border);
font-weight: 600;
font-size: 15px;
}
.chat-item {
display: flex;
align-items: center;
gap: 12px;
padding: 14px 16px;
cursor: pointer;
border-bottom: 1px solid var(--border);
transition: background 0.2s;
position: relative;
}
.chat-item:hover, .chat-item.active {
background: var(--bg-tertiary);
}
.chat-item.pinned {
background: rgba(16,185,129,0.05);
border-left: 3px solid var(--accent);
}
.chat-item-avatar {
width: 40px;
height: 40px;
border-radius: 50%;
background: var(--bg-tertiary);
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
flex-shrink: 0;
}
.chat-item-avatar img {
width: 100%;
height: 100%;
object-fit: cover;
}
.chat-item-info {
flex: 1;
overflow: hidden;
}
.chat-item-name {
font-size: 13px;
font-weight: 600;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.chat-item-last {
font-size: 12px;
color: var(--text-muted);
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.chat-item-time {
font-size: 10px;
color: var(--text-muted);
position: absolute;
top: 14px;
right: 16px;
}
.chat-item-badge {
position: absolute;
bottom: 14px;
right: 16px;
background: var(--accent);
color: #fff;
font-size: 10px;
width: 18px;
height: 18px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-weight: 600;
}
.chat-main {
flex: 1;
display: flex;
flex-direction: column;
}
.chat-header {
display: flex;
align-items: center;
gap: 12px;
padding: 12px 20px;
background: var(--bg-secondary);
border-bottom: 1px solid var(--border);
}
.chat-header-info {
flex: 1;
}
.chat-header-name {
font-size: 14px;
font-weight: 600;
}
.chat-header-status {
font-size: 11px;
color: var(--text-muted);
}
.chat-header-actions {
display: flex;
gap: 8px;
}
.chat-header-btn {
width: 32px;
height: 32px;
border-radius: 8px;
background: var(--bg-tertiary);
color: var(--text-secondary);
display: flex;
align-items: center;
justify-content: center;
font-size: 16px;
}
.chat-header-btn:hover {
background: var(--border);
color: var(--text-primary);
}
.chat-ad-info {
display: flex;
align-items: center;
gap: 10px;
padding: 10px 20px;
background: var(--bg-tertiary);
border-bottom: 1px solid var(--border);
}
.chat-ad-img {
width: 40px;
height: 40px;
border-radius: 6px;
object-fit: cover;
background: var(--bg-input);
}
.chat-ad-name {
font-size: 12px;
font-weight: 500;
}
.chat-ad-price {
font-size: 12px;
color: var(--accent);
font-weight: 600;
}
.chat-messages {
flex: 1;
overflow-y: auto;
padding: 16px 20px;
display: flex;
flex-direction: column;
gap: 8px;
}
.message {
max-width: 70%;
padding: 10px 14px;
border-radius: 12px;
font-size: 13px;
line-height: 1.5;
position: relative;
}
.message.sent {
align-self: flex-end;
background: var(--accent);
color: #fff;
border-bottom-right-radius: 4px;
}
.message.received {
align-self: flex-start;
background: var(--bg-tertiary);
color: var(--text-primary);
border-bottom-left-radius: 4px;
}
.message-id {
font-size: 9px;
opacity: 0.6;
margin-top: 4px;
}
.message-time {
font-size: 10px;
opacity: 0.6;
margin-top: 2px;
}
.chat-input-area {
display: flex;
gap: 10px;
padding: 16px 20px;
background: var(--bg-secondary);
border-top: 1px solid var(--border);
}
.chat-input {
flex: 1;
padding: 12px 16px;
border-radius: 24px;
background: var(--bg-input);
border: 1px solid var(--border);
color: var(--text-primary);
font-size: 13px;
}
.chat-send-btn {
width: 44px;
height: 44px;
border-radius: 50%;
background: var(--accent);
color: #fff;
display: flex;
align-items: center;
justify-content: center;
font-size: 18px;
}
.chat-send-btn:hover {
background: var(--accent-hover);
}
.no-chat-selected {
flex: 1;
display: flex;
align-items: center;
justify-content: center;
color: var(--text-muted);
font-size: 14px;
}

/* Profile */
.profile-page {
max-width: 800px;
margin: 0 auto;
}
.profile-header {
display: flex;
align-items: center;
gap: 24px;
padding: 24px;
background: var(--bg-card);
border-radius: 16px;
border: 1px solid var(--border);
margin-bottom: 24px;
}
.profile-avatar-large {
width: 80px;
height: 80px;
border-radius: 50%;
background: var(--bg-tertiary);
overflow: hidden;
display: flex;
align-items: center;
justify-content: center;
font-size: 32px;
flex-shrink: 0;
}
.profile-avatar-large img {
width: 100%;
height: 100%;
object-fit: cover;
}
.profile-info {
flex: 1;
}
.profile-name {
font-size: 22px;
font-weight: 700;
margin-bottom: 4px;
}
.profile-plan-badge {
display: inline-block;
padding: 4px 12px;
border-radius: 6px;
font-size: 12px;
font-weight: 600;
margin-bottom: 8px;
}
.profile-plan-badge.free { background: #333; color: #999; }
.profile-plan-badge.replus { background: rgba(251,191,36,0.15); color: var(--gold); }
.profile-plan-badge.repremium { background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #f5576c); color: #fff; animation: shimmer 2s infinite; }
@keyframes shimmer {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}
.profile-subscription-end {
font-size: 12px;
color: var(--text-muted);
margin-bottom: 8px;
}
.profile-register-date {
font-size: 12px;
color: var(--text-muted);
}
.profile-rating {
display: flex;
align-items: center;
gap: 8px;
margin-top: 8px;
}
.profile-rating-stars {
color: var(--gold);
font-size: 14px;
}
.profile-rating-count {
font-size: 12px;
color: var(--text-secondary);
}
.profile-actions {
display: flex;
gap: 10px;
margin-top: 16px;
}
.profile-actions button {
padding: 8px 16px;
border-radius: 8px;
font-size: 13px;
font-weight: 600;
}
.btn-primary {
background: var(--accent);
color: #fff;
}
.btn-primary:hover {
background: var(--accent-hover);
}
.btn-secondary {
background: var(--bg-tertiary);
color: var(--text-secondary);
}
.btn-secondary:hover {
background: var(--border);
}
.btn-danger {
background: var(--danger);
color: #fff;
}
.btn-danger:hover {
background: #dc2626;
}
.btn-gold {
background: linear-gradient(135deg, #fbbf24, #f59e0b);
color: #000;
}
.profile-listings {
margin-top: 24px;
}
.profile-listings h3 {
font-size: 16px;
font-weight: 600;
margin-bottom: 16px;
}
.my-listing-card {
display: flex;
align-items: center;
gap: 16px;
padding: 12px;
background: var(--bg-card);
border-radius: 10px;

// Auth State Observer
onAuthStateChanged(auth, async (user) => {
if (user) {
if (!user.emailVerified) {
await signOut(auth);
document.getElementById('authScreen').style.display = 'flex';
document.getElementById('mainApp').style.display = 'none';
return;
}
currentUser = user;
currentUserData = (await getDoc(doc(db, 'users', user.uid))).data();
if (!currentUserData) {
await signOut(auth);
return;
}
if (currentUserData.isBlocked) {
document.getElementById('authScreen').style.display = 'none';
document.getElementById('mainApp').style.display = 'none';
document.getElementById('blockedScreen').classList.remove('hidden');
return;
}
document.getElementById('authScreen').style.display = 'none';
document.getElementById('mainApp').style.display = 'block';
updateSidebar();
navigateTo('home');
// Set online status
await updateDoc(doc(db, 'users', user.uid), {
lastSeen: serverTimestamp(),
isOnline: true
});
window.addEventListener('beforeunload', async () => {
await updateDoc(doc(db, 'users', user.uid), { isOnline: false });
});
} else {
currentUser = null;
currentUserData = null;
document.getElementById('authScreen').style.display = 'flex';
document.getElementById('mainApp').style.display = 'none';
document.getElementById('blockedScreen').classList.add('hidden');
if (chatsListener) chatsListener();
if (messagesListener) messagesListener();
renderAuthForm();
}
});

case 3:
formHTML = `
<h2>Шаг 3: Состояние</h2>
<div class="form-group">
<label>Выберите состояние товара</label>
<select id="createCondition">
<option value="">Выберите...</option>
<option value="Новое с биркой (NWT)" ${createData.condition === 'Новое с биркой (NWT)' ? 'selected' : ''}>Новое с биркой (NWT)</option>
<option value="Отличное" ${createData.condition === 'Отличное' ? 'selected' : ''}>Отличное</option>
<option value="Хорошее" ${createData.condition === 'Хорошее' ? 'selected' : ''}>Хорошее</option>
<option value="Удовлетворительное" ${createData.condition === 'Удовлетворительное' ? 'selected' : ''}>Удовлетворительное</option>
</select>
</div>
`;
break;
case 4:
formHTML = `
<h2>Шаг 4: Цвет</h2>
<div class="form-group">
<label>Цвет товара</label>
<input type="text" id="createColor" value="${escHtml(createData.color || '')}" placeholder="Например: Чёрный, Белый">
</div>
`;
break;
case 5:
formHTML = `
<h2>Шаг 5: Размер</h2>
<div class="form-group">
<label>Размер</label>
<input type="text" id="createSize" value="${escHtml(createData.size || '')}" placeholder="Например: S, M, 42, 38">
</div>
`;
break;
case 6:
formHTML = `
<h2>Шаг 6: Цена</h2>
<div class="form-group">
<label>Цена (₽)</label>
<input type="number" id="createPrice" value="${createData.price || ''}" placeholder="Например: 5000">
</div>
`;
break;
case 7:
formHTML = `
<h2>Шаг 7: Описание</h2>
<div class="form-group">
<label>Описание товара</label>
<textarea id="createDescription" placeholder="Подробно опишите товар, дефекты и т.д." style="min-height:150px;">${escHtml(createData.description || '')}</textarea>

${canUseOriginal() ? `
<label class="original-check">

`;
break;
case 8:
formHTML = `
<h2>Шаг 8: Город</h2>

<label>Город</label>
<input type="text" id="createCity" value="${escHtml(createData.city || '')}" placeholder="Например: Москва">

break;
}

const isLast = createStep === steps.length;
formHTML += `

return currentUserData && (currentUserData.plan === 'replus' || currentUserData.plan === 'repremium');
}

window.uploadListingPhotos = async (input) => {

method: 'POST',
body: formData

window.nextCreateStep = () => {
switch (createStep) {
case 1:
createData.title = document.getElementById('createTitle').value.trim();
if (!createData.title) return alert('Введите название');
break;
case 2:
if (listingPhotos.length < 1) return alert('Загрузите хотя бы 1 фотографию');
break;
case 3:
createData.condition = document.getElementById('createCondition').value;
if (!createData.condition) return alert('Выберите состояние');
break;
case 4:
createData.color = document.getElementById('createColor').value.trim();
break;
case 5:
createData.size = document.getElementById('createSize').value.trim();
break;
case 6:
createData.price = document.getElementById('createPrice').value;
if (!createData.price || Number(createData.price) <= 0) return alert('Введите корректную цену');
break;
case 7:
createData.description = document.getElementById('createDescription').value.trim();

break;
case 8:

return;
}

renderCreateStep(document.getElementById('pageContent'));

window.prevCreateStep = () => {
if (createStep > 1) {
createStep--;
renderCreateStep(document.getElementById('pageContent'));
}
};

async function createListing() {
if (createData.isOriginal && currentUserData) {
const now = new Date();
if (currentUserData.plan === 'replus') {
const reset = currentUserData.originalsMonthReset ? currentUserData.originalsMonthReset.toDate() : new Date(0);
if (now.getMonth() === reset.getMonth() && now.getFullYear() === reset.getFullYear()) {
if ((currentUserData.originalsUsed || 0) >= 2) {
return alert('Лимит отметок "Оригинал" для Replus: 2 в месяц');
}
} else {
await updateDoc(doc(db, 'users', currentUser.uid), { originalsUsed: 0, originalsMonthReset: serverTimestamp() });
}
} else if (currentUserData.plan === 'repremium') {
// 5 per week
const reset = currentUserData.originalsWeekReset ? currentUserData.originalsWeekReset.toDate() : new Date(0);
const weekDiff = Math.floor((now - reset) / (7 * 24 * 60 * 60 * 1000));
if (weekDiff === 0) {
if ((currentUserData.originalsUsed || 0) >= 5) {
return alert('Лимит отметок "Оригинал" для RePremium: 5 в неделю');
}
} else {
await updateDoc(doc(db, 'users', currentUser.uid), { originalsUsed: 0, originalsWeekReset: serverTimestamp() });
}
}
}

await addDoc(collection(db, 'listings'), {
title: createData.title,
photos: listingPhotos,
condition: createData.condition,
color: createData.color,
size: createData.size,
price: Number(createData.price),
description: createData.description,
city: createData.city,
isOriginal: createData.isOriginal || false,
sellerId: currentUser.uid,
status: 'review',
createdAt: serverTimestamp()
});

if (createData.isOriginal && currentUserData) {
await updateDoc(doc(db, 'users', currentUser.uid), {
originalsUsed: increment(1)
});
}

alert('Объявление отправлено на модерацию!');
navigateTo('myListings');
}

window.applyPromoCode = async () => {
const code = document.getElementById('promoCode').value.trim();
if (!code) return alert('Введите промокод');

// Check promo codes collection
const promosRef = collection(db, 'promoCodes');
const q = query(promosRef, where('code', '==', code.toUpperCase()), where('isActive', '==', true));
const snap = await getDocs(q);
if (snap.empty) {
return alert('Промокод не найден');
}

const promo = snap.docs[0].data();
const promoDocId = snap.docs[0].id;

// Validate plan and period match
if (promo.plan !== selectedPlan || promo.period !== selectedPlanPeriod) {
return alert('Этот промокод не подходит для выбранной подписки или периода');
}

// Calculate end date
const now = new Date();
let months = 1;
if (selectedPlanPeriod.includes('3')) months = 3;
if (selectedPlanPeriod.includes('6')) months = 6;
const endDate = new Date(now.getFullYear(), now.getMonth() + months, now.getDate());

await updateDoc(doc(db, 'users', currentUser.uid), {
plan: selectedPlan,
planEndsAt: endDate,
});

// Deactivate promo code
await updateDoc(doc(db, 'promoCodes', promoDocId), { isActive: false, usedBy: currentUser.uid, usedAt: serverTimestamp() });

closeModal();
alert(`Промокод активирован! Вы получили подписку ${getPlanLabel(selectedPlan)} на ${selectedPlanPeriod}.`);
currentUserData.plan = selectedPlan;
currentUserData.planEndsAt = endDate;
updateSidebar();
};

window.deleteReviewByAdmin = async () => {
const reviewId = document.getElementById('deleteReviewId').value.trim();
if (!reviewId) return alert('Введите ID отзыва');
const reviewDoc = await getDoc(doc(db, 'reviews', reviewId));
if (!reviewDoc.exists()) return alert('Отзыв не найден');
const review = reviewDoc.data();
await deleteDoc(doc(db, 'reviews', reviewId));
// Recalculate rating
const reviewsQ = query(collection(db, 'reviews'), where('targetUserId', '==', review.targetUserId));
const reviewsSnap = await getDocs(reviewsQ);
let total = 0;
reviewsSnap.forEach(r => { total += r.data().rating || 0; });
const avg = reviewsSnap.empty ? 0 : total / reviewsSnap.size;
await updateDoc(doc(db, 'users', review.targetUserId), {
rating: Math.round(avg * 100) / 100,
reviewsCount: reviewsSnap.size
});
alert('Отзыв удалён, рейтинг пересчитан');
};
