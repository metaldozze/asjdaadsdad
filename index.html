      if (!data) {
        localStorage.setItem(key, JSON.stringify(fallback));
        return fallback;
      }
      return JSON.parse(data);
    };

    // Seed Data
    getStored("relook_users", DEFAULT_USERS);

      red: { bg: 'bg-red-950 hover:bg-red-900', border: 'border-red-900', text: 'text-red-400', hex: '#ef4444' }
    };

    // Global Action Utilities
    window.showToast = (title, message, avatar = null) => {
      state.toast = { title, message, avatar };
      render();
      setTimeout(() => {
        state.toast = null;
        render();
      }, 5000);
    };

    window.closeToast = () => {
      state.toast = null;
      render();
    };

    const generateId = () => Math.random().toString(36).substr(2, 9).toUpperCase();

    // Trigger state changes & render UI
    const updateState = (updates) => {
      Object.assign(state, updates);
      render();
    };

    // Firebase Auth Hookup
    onAuthStateChanged(auth, (usr) => {
      state.firebaseUser = usr;
      if (usr) {
        const users = getStored("relook_users", DEFAULT_USERS);
        let localUser = Object.values(users).find(u => u.email === usr.email);
        
        if (!localUser) {
          const newId = generateId();
          localUser = {
            id: newId,
            email: usr.email,
            nickname: usr.displayName || `user_${newId}`,
            avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150",
            subscription: "free",
            expiry: null,
            regDate: new Date().toLocaleDateString("ru-RU"),
            rating: 5.0,
            reviewsCount: 0,
            warnings: [],
            restricted: false,
            blocked: false,
            lastSeen: "В сети"
          };
          users[newId] = localUser;
          saveStored("relook_users", users);
        }
        state.dbUser = localUser;
      } else {
        state.dbUser = null;
      }
      render();
    });

    // Simulated Real-Time DB polling for updates (ban, limit, warn)
    setInterval(() => {
      if (state.dbUser) {
        const users = getStored("relook_users", DEFAULT_USERS);
        const latest = users[state.dbUser.id];
        if (latest && JSON.stringify(latest) !== JSON.stringify(state.dbUser)) {
          state.dbUser = latest;
          render();
        }
      }
    }, 2000);

    const applyThemeClasses = () => {
      const root = document.documentElement;
      if (state.theme === 'dark') {
        root.classList.add('dark');
        document.body.className = "bg-zinc-950 text-zinc-100 transition-colors duration-300";
      } else {
        root.classList.remove('dark');
        document.body.className = "bg-gray-50 text-gray-900 transition-colors duration-300";
      }
    };

    // RENDER CORE
    const render = () => {
      applyThemeClasses();
      const appDiv = document.getElementById('app');
      
      // If blocked screen overlay is active
      if (state.dbUser && state.dbUser.blocked) {
        appDiv.innerHTML = renderBlockedScreen();
        lucide.createIcons();
        attachCoreEvents();
        return;

      // Warning popup overlay
      let warningOverlay = '';
      if (state.dbUser && state.dbUser.warnings && state.dbUser.warnings.length > 0) {
        warningOverlay = renderWarningOverlay(state.dbUser.warnings[state.dbUser.warnings.length - 1]);

      if (!state.firebaseUser) {
        appDiv.innerHTML = renderAuthFlow() + warningOverlay;
      } else {
        appDiv.innerHTML = `

            <!-- Main Display Area -->

              ${renderMainTabContent()}
            </main>
          </div>
          ${warningOverlay}
          ${renderToastNotification()}
          ${renderCreateListingModal()}

      attachCoreEvents();
    };

          <div class="space-y-4">
            <label class="text-xs uppercase font-bold tracking-wider text-zinc-400">Ссылки на изображения (минимум 1)</label>
            <div class="space-y-2">
              ${data.images.map((img, idx) => `
                <input class="create-image-input w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white text-xs" placeholder="Ссылка на фото #${idx + 1}" value="${img}" data-idx="${idx}" />
              `).join('')}
            </div>
            <button id="btn-add-image-row" class="text-xs text-emerald-400 flex items-center gap-1 hover:underline font-semibold">+ Добавить еще ссылку</button>
          </div>
        `;
      } else if (step === 3) {
        modalContent = `
          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs uppercase font-bold tracking-wider text-zinc-400">Состояние вещи</label>
                <select id="create-condition" class="w-full mt-1.5 p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white text-sm">
                  <option ${data.condition === 'Новое с биркой (NWT)' ? 'selected' : ''}>Новое с биркой (NWT)</option>
                  <option ${data.condition === 'Отличное' ? 'selected' : ''}>Отличное</option>
                  <option ${data.condition === 'Хорошее' ? 'selected' : ''}>Хорошее</option>
                  <option ${data.condition === 'Удовлетворительное' ? 'selected' : ''}>Удовлетворительное</option>
                </select>
              </div>
              <div>
                <label class="text-xs uppercase font-bold tracking-wider text-zinc-400">Цвет</label>
                <input id="create-color" placeholder="Синий" value="${data.color}" class="w-full mt-1.5 p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white text-sm" />
              </div>
            </div>
            <div>
              <label class="text-xs uppercase font-bold tracking-wider text-zinc-400">Укажите Размер</label>
              <input id="create-size" placeholder="XL / 42 / 32" value="${data.size}" class="w-full mt-1.5 p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white text-sm" />
            </div>
          </div>
        `;
      } else if (step === 4) {
        modalContent = `
          <div class="space-y-4">
            <div>
              <label class="text-xs uppercase font-bold tracking-wider text-zinc-400">Цена (в рублях)</label>
              <input type="number" id="create-price" placeholder="4500" value="${data.price}" class="w-full mt-1.5 p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white font-bold text-sm" />
            </div>
            <div class="p-4 bg-zinc-950 border border-zinc-800 rounded-2xl flex items-center justify-between">
              <div>
                <h4 class="font-bold text-xs text-white">Вещь является оригиналом</h4>
                <p class="text-[10px] text-zinc-500 mt-1">Отображать значок оригинальности в каталоге</p>
              </div>
              <input type="checkbox" id="create-original" ${data.isOriginal ? 'checked' : ''} class="rounded border-zinc-800 text-emerald-500 bg-zinc-900 focus:ring-0 w-5 h-5 cursor-pointer" />
            </div>
          </div>
        `;
      } else if (step === 5) {
        modalContent = `
          <div class="space-y-4">
            <div>
              <label class="text-xs uppercase font-bold tracking-wider text-zinc-400">Описание лота</label>
              <textarea id="create-desc" rows="5" placeholder="Расскажите о нюансах, замерах вещи и комплектации..." class="w-full mt-1.5 p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white text-sm">${data.desc}</textarea>
            </div>
          </div>
        `;
      } else if (step === 6) {
        modalContent = `
          <div class="space-y-4 text-center py-6">
            <i data-lucide="check-circle" class="mx-auto text-emerald-500 animate-bounce w-14 h-14"></i>
            <h4 class="text-lg font-bold font-logo">Лот готов к проверке</h4>
            <p class="text-xs text-zinc-500 leading-relaxed max-w-sm mx-auto">
              После сохранения объявление будет отправлено модераторам Relook. Мы проверим описание и фотографии на соблюдение регламентов площадки в течение 15 минут.
            </p>
          </div>
        `;
      }

      return `
        <div class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div class="bg-white dark:bg-zinc-900 rounded-3xl max-w-lg w-full p-6 md:p-8 space-y-6 relative border border-gray-150 dark:border-zinc-850 text-zinc-900 dark:text-zinc-100">
            <button id="btn-close-create-modal" class="absolute top-4 right-4 text-zinc-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            <div class="flex items-center justify-between border-b border-zinc-100 dark:border-zinc-850 pb-4">
              <h3 class="text-lg font-black tracking-tight font-logo">Создание объявления</h3>
              <span class="text-xs font-bold text-zinc-500">Шаг ${step} из 6</span>
            </div>

            ${modalContent}

            <div class="flex gap-2 justify-end pt-4 border-t border-zinc-100 dark:border-zinc-850">
              ${step > 1 ? `<button id="btn-create-prev" class="px-4 py-2 bg-zinc-100 dark:bg-zinc-800 text-sm font-semibold rounded-lg text-zinc-900 dark:text-white">Назад</button>` : ''}
              ${step < 6 ? `
                <button id="btn-create-next" class="px-5 py-2 ${act.bg} text-sm font-bold rounded-lg text-white">Дальше</button>
              ` : `
                <button id="btn-create-submit" class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 text-sm font-bold rounded-lg text-white font-logo">Опубликовать лот</button>
              `}
            </div>
          </div>
        </div>
      `;
    };

    // EXPOSE LOGIC TO GLOBAL FOR EVENT LISTENERS
    window.viewSellerProfile = (sellerId) => {
      const users = getStored("relook_users", DEFAULT_USERS);
      state.selectedSeller = users[sellerId];
      state.currentTab = 'profile';
      state.selectedListing = null;
      render();
    };

    // EVENTS ROUTER (Vanilla delegation framework)
    const attachCoreEvents = () => {
      // Sidebar click handler
      document.querySelectorAll('.sidebar-btn').forEach(btn => {
        btn.onclick = () => {
          const tab = btn.getAttribute('data-tab');
          updateState({ currentTab: tab, selectedListing: null, selectedSeller: null });
        };
      });

      // Item card click to open listing details
      document.querySelectorAll('.listing-card').forEach(card => {
        card.onclick = () => {
          const listings = getStored("relook_listings", DEFAULT_LISTINGS);
          const lid = card.getAttribute('data-listing-id');
          const found = listings.find(l => l.id === lid);
          updateState({ selectedListing: found });
        };
      });

      // Gallery Switcher inside detail page
      document.querySelectorAll('.gallery-thumbnail-btn').forEach(btn => {
        btn.onclick = () => {
          const src = btn.getAttribute('data-img-src');
          const activeImg = document.getElementById('detail-active-img');
          if (activeImg) activeImg.src = src;
        };
      });

      // Close Detail view
      const btnCloseDetail = document.getElementById('btn-close-detail-view');
      if (btnCloseDetail) {
        btnCloseDetail.onclick = () => updateState({ selectedListing: null });
      }

      // Delete Listing
      const btnDeleteListing = document.getElementById('btn-delete-listing');
      if (btnDeleteListing) {
        btnDeleteListing.onclick = () => {
          if (confirm("Вы точно хотите удалить объявление? Вернуть его никак не получится.")) {
            const listings = getStored("relook_listings", DEFAULT_LISTINGS);
            const updated = listings.filter(l => l.id !== state.selectedListing.id);
            saveStored("relook_listings", updated);
            showToast("Удалено", "Объявление полностью удалено.");
            updateState({ selectedListing: null });
          }
        };
      }

      // Start chat from Listing detail
      const btnStartChat = document.getElementById('btn-start-chat');
      if (btnStartChat) {
        btnStartChat.onclick = () => {
          if (state.dbUser.restricted) {
            showToast("Ошибка", "Ваш аккаунт ограничен! Вы не можете писать в чаты.");
            return;
          }
          const chats = getStored("relook_chats", DEFAULT_CHATS);
          const l = state.selectedListing;
          const u = state.dbUser;
          let chat = chats.find(c => c.buyerId === u.id && c.sellerId === l.sellerId && c.listingId === l.id);
          
          if (!chat) {
            chat = {
              id: "CHAT-" + generateId(),
              buyerId: u.id,
              sellerId: l.sellerId,
              listingId: l.id,
              pinned: { [u.id]: false, [l.sellerId]: false },
              muted: { [u.id]: false, [l.sellerId]: false },
              blockedBy: null,
              messages: [
                {
                  id: generateId(),
                  senderId: "system",
                  text: "Чат создан. Обсуждайте условия сделки только здесь для работы Гарантии защиты.",
                  time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                  date: new Date().toLocaleDateString("ru-RU")
                }
              ]
            };
            chats.push(chat);
            saveStored("relook_chats", chats);
          }
          updateState({ currentTab: 'chats', activeChat: chat, selectedListing: null });
        };
      }

      // Chat sidebar items click
      document.querySelectorAll('.chat-sidebar-item').forEach(item => {
        item.onclick = () => {
          const chats = getStored("relook_chats", DEFAULT_CHATS);
          const cid = item.getAttribute('data-chat-id');
          const found = chats.find(c => c.id === cid);
          updateState({ activeChat: found });
        };
      });

      // Options dropdown trigger in Chat view
      const btnChatOptsTrigger = document.getElementById('btn-chat-options-trigger');
      if (btnChatOptsTrigger) {
        btnChatOptsTrigger.onclick = () => {
          const dropdown = document.getElementById('chat-options-dropdown');
          if (dropdown) dropdown.classList.toggle('hidden');
        };
      }

      // Toggle Chat Mute
      const btnToggleMute = document.getElementById('btn-toggle-mute');
      if (btnToggleMute) {
        btnToggleMute.onclick = () => {
          const chats = getStored("relook_chats", DEFAULT_CHATS);
          const idx = chats.findIndex(c => c.id === state.activeChat.id);
          if (idx !== -1) {
            const cur = chats[idx].muted?.[state.dbUser.id] || false;
            chats[idx].muted = { ...chats[idx].muted, [state.dbUser.id]: !cur };
            saveStored("relook_chats", chats);
            state.activeChat = chats[idx];
            showToast("Уведомления", !cur ? "Уведомления выключены" : "Уведомления включены");
          }
        };
      }

      // Report Trigger
      const btnReportTrigger = document.getElementById('btn-report-chat-trigger');
      if (btnReportTrigger) {
        btnReportTrigger.onclick = () => {
          document.getElementById('report-modal').classList.remove('hidden');
        };
      }
      const btnCancelReport = document.getElementById('btn-cancel-report');
      if (btnCancelReport) {
        btnCancelReport.onclick = () => document.getElementById('report-modal').classList.add('hidden');
      }
      const btnSubmitReport = document.getElementById('btn-submit-report');
      if (btnSubmitReport) {
        btnSubmitReport.onclick = () => {
          const msgId = document.getElementById('report-msg-id').value;
          const text = document.getElementById('report-text').value;
          if (msgId && text) {
            showToast("Жалоба", "Жалоба отправлена в поддержку.");
            document.getElementById('report-modal').classList.add('hidden');
          }
        };
      }

      // Block User
      const btnToggleBlock = document.getElementById('btn-toggle-block');
      if (btnToggleBlock) {
        btnToggleBlock.onclick = () => {
          if (state.dbUser.subscription === 'free') {
            showToast("Премиум", "Блокировка пользователей доступна подписчикам RePlus или RePremium.");
            return;
          }
          const chats = getStored("relook_chats", DEFAULT_CHATS);
          const idx = chats.findIndex(c => c.id === state.activeChat.id);
          if (idx !== -1) {
            const blocked = chats[idx].blockedBy === state.dbUser.id;
            chats[idx].blockedBy = blocked ? null : state.dbUser.id;
            saveStored("relook_chats", chats);
            state.activeChat = chats[idx];
            showToast("Блокировка", blocked ? "Пользователь разблокирован" : "Пользователь заблокирован");
          }
        };
      }

      // Pin Chat
      const btnTogglePin = document.getElementById('btn-toggle-pin');
      if (btnTogglePin) {
        btnTogglePin.onclick = () => {
          const limit = state.dbUser.subscription === 'free' ? 1 : state.dbUser.subscription === 'replus' ? 8 : 50;
          const chats = getStored("relook_chats", DEFAULT_CHATS);
          const myChats = chats.filter(c => c.buyerId === state.dbUser.id || c.sellerId === state.dbUser.id);
          const pinnedCount = myChats.filter(c => c.pinned?.[state.dbUser.id]).length;

          const idx = chats.findIndex(c => c.id === state.activeChat.id);
          if (idx !== -1) {
            const alreadyPinned = chats[idx].pinned?.[state.dbUser.id] || false;
            if (!alreadyPinned && pinnedCount >= limit) {
              showToast("Лимит", `Ваш лимит закрепленных чатов: ${limit}. Обновите тариф.`);
              return;
            }
            chats[idx].pinned = { ...chats[idx].pinned, [state.dbUser.id]: !alreadyPinned };
            saveStored("relook_chats", chats);
            state.activeChat = chats[idx];
            showToast("Закреплено", !alreadyPinned ? "Диалог закреплен" : "Диалог откреплен");
          }
        };
      }

      // Delete Chat
      const btnDeleteChat = document.getElementById('btn-delete-chat');
      if (btnDeleteChat) {
        btnDeleteChat.onclick = () => {
          if (state.dbUser.subscription !== 'repremium') {
            showToast("Премиум", "Функция удаления диалога навсегда доступна только пользователям тарифа RePremium.");
            return;
          }
          if (confirm("Вы хотите безвозвратно удалить этот диалог?")) {
            const chats = getStored("relook_chats", DEFAULT_CHATS);
            const filtered = chats.filter(c => c.id !== state.activeChat.id);
            saveStored("relook_chats", filtered);
            updateState({ activeChat: null });
            showToast("Удалено", "Диалог удален у каждого участника.");
          }
        };
      }

      // Send Message
      const btnSendMsg = document.getElementById('btn-send-msg');
      if (btnSendMsg) {
        btnSendMsg.onclick = () => {
          if (state.dbUser.restricted) {
            showToast("Ограничение", "Ваш аккаунт ограничен! Отправка сообщений временно заблокирована.");
            return;
          }
          const textInput = document.getElementById('chat-input');
          if (!textInput || !textInput.value.trim()) return;

          const chats = getStored("relook_chats", DEFAULT_CHATS);
          const idx = chats.findIndex(c => c.id === state.activeChat.id);
          if (idx !== -1) {
            if (chats[idx].blockedBy) {
              showToast("Блокировка", "Собеседник заблокировал чат.");
              return;
            }
            const msg = {
              id: "MSG-" + generateId(),
              senderId: state.dbUser.id,
              text: textInput.value,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              date: new Date().toLocaleDateString("ru-RU")
            };
            chats[idx].messages.push(msg);
            saveStored("relook_chats", chats);
            state.activeChat = chats[idx];
            textInput.value = '';
            render();
          }
        };
      }

      // Rate modal trigger
      const btnRateTrigger = document.getElementById('btn-rate-peer-trigger');
      if (btnRateTrigger) {
        btnRateTrigger.onclick = () => {
          document.getElementById('rate-modal').classList.remove('hidden');
        };
      }
      const btnCancelRate = document.getElementById('btn-cancel-rate');
      if (btnCancelRate) {
        btnCancelRate.onclick = () => document.getElementById('rate-modal').classList.add('hidden');
      }
      const btnSubmitRate = document.getElementById('btn-submit-rate');
      if (btnSubmitRate) {
        btnSubmitRate.onclick = () => {
          const text = document.getElementById('rate-comment-text').value;
          const reviews = getStored("relook_reviews", DEFAULT_REVIEWS);
          const users = getStored("relook_users", DEFAULT_USERS);
          const listings = getStored("relook_listings", DEFAULT_LISTINGS);

          const otherId = state.activeChat.buyerId === state.dbUser.id ? state.activeChat.sellerId : state.activeChat.buyerId;
          const targetListing = listings.find(l => l.id === state.activeChat.listingId);

          const newRev = {
            id: "REV-" + generateId(),
            targetUserId: otherId,
            authorId: state.dbUser.id,
            authorName: state.dbUser.nickname,
            authorAvatar: state.dbUser.avatar,
            rating: state.authForm.rateStarValue || 5,
            listingTitle: targetListing ? targetListing.title : "Товар",
            dealCompleted: state.authForm.dealSuccess || true,
            text: text
          };

          reviews.push(newRev);
          saveStored("relook_reviews", reviews);

          // update scores
          const targetReviews = reviews.filter(r => r.targetUserId === otherId);
          const avg = targetReviews.reduce((sum, r) => sum + r.rating, 0) / targetReviews.length;
          users[otherId].rating = avg;
          users[otherId].reviewsCount = targetReviews.length;
          saveStored("relook_users", users);

          showToast("Успех", "Отзыв успешно отправлен на модерацию!");
          document.getElementById('rate-modal').classList.add('hidden');
        };
      }
      document.querySelectorAll('.star-btn').forEach(btn => {
        btn.onclick = () => {
          const val = Number(btn.getAttribute('data-star'));
          state.authForm.rateStarValue = val;
          document.querySelectorAll('.star-btn i').forEach((star, i) => {
            if (i < val) {
              star.classList.add('fill-amber-400', 'text-amber-400');
            } else {
              star.classList.remove('fill-amber-400', 'text-amber-400');
            }
          });
        };
      });

      // Send support message
      const btnSendSupport = document.getElementById('btn-send-support');
      if (btnSendSupport) {
        btnSendSupport.onclick = () => {
          const input = document.getElementById('support-input');
          if (!input || !input.value.trim()) return;

          const support = getStored("relook_support", []);
          const msg = {
            id: generateId(),
            userId: state.dbUser.id,
            userNick: state.dbUser.nickname,
            sender: "user",
            text: input.value,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            date: new Date().toLocaleDateString("ru-RU")
          };
          support.push(msg);
          saveStored("relook_support", support);
          input.value = '';
          render();
        };
      }

      // Premium select plan
      document.querySelectorAll('.btn-select-plan').forEach(btn => {
        btn.onclick = () => {
          const plan = btn.getAttribute('data-plan');
          const panel = document.getElementById('payment-module');
          const planDisplay = document.getElementById('display-payment-plan');
          
          if (panel) panel.classList.remove('hidden');
          if (planDisplay) planDisplay.innerText = plan;
          state.authForm.selectedPlan = plan;
        };
      });

      // Simulated bank card fail
      const btnCardPay = document.getElementById('btn-card-pay');
      if (btnCardPay) {
        btnCardPay.onclick = () => {
          showToast("Ошибка оплаты", "Метод оплаты картой временно недоступен. Используйте промокод.");
        };
      }

      // Promo activate logic
      const btnSubmitPromo = document.getElementById('btn-submit-promo');
      if (btnSubmitPromo) {
        btnSubmitPromo.onclick = () => {
          const promo = document.getElementById('payment-promo-input').value.toUpperCase();
          const codes = getStored("relook_promocodes", DEFAULT_PROMOCODES);
          const found = codes.find(c => c.code.toUpperCase() === promo);

          if (!found) {
            showToast("Ошибка", "Такой промокод не найден!");
            return;
          }

          if (state.authForm.selectedPlan && found.type !== state.authForm.selectedPlan) {
            showToast("Ошибка", `Этот промокод действителен только для тарифа ${found.type.toUpperCase()}`);
            return;
          }

          const users = getStored("relook_users", DEFAULT_USERS);
          const exp = new Date();
          exp.setDate(exp.getDate() + found.durationDays);

          users[state.dbUser.id].subscription = found.type;
          users[state.dbUser.id].expiry = exp.toLocaleDateString("ru-RU");

          saveStored("relook_users", users);
          state.dbUser = users[state.dbUser.id];
          showToast("Успех", `Активирован промокод на ${found.type.toUpperCase()}`);
          render();
        };
      }

      // Settings Theme Toggle
      const btnToggleTheme = document.getElementById('btn-toggle-theme');
      if (btnToggleTheme) {
        btnToggleTheme.onclick = () => {
          const next = state.theme === 'dark' ? 'light' : 'dark';
          localStorage.setItem("theme_mode", next);
          state.theme = next;
          render();
        };
      }

      // Accent buttons setting
      document.querySelectorAll('.accent-btn').forEach(btn => {
        btn.onclick = () => {
          const col = btn.getAttribute('data-accent');
          if (col !== 'green' && state.dbUser.subscription !== 'repremium') {
            showToast("Премиум", "Смена цветового акцента доступна только RePremium подписчикам!");
            return;
          }
          localStorage.setItem("theme_accent", col);
          state.accent = col;
          render();
        };
      };

      // Admin logic handlers
      const btnAdminBan = document.getElementById('btn-admin-ban');
      if (btnAdminBan) {
        btnAdminBan.onclick = () => {
          const targetId = document.getElementById('admin-target-id').value;
          if (!targetId) return;
          const users = getStored("relook_users", DEFAULT_USERS);
          if (users[targetId]) {
            users[targetId].blocked = true;
            users[targetId].nickname = "Аккаунт заблокирован";
            saveStored("relook_users", users);
            showToast("Админ", "Пользователь заблокирован!");
          }
        };
      }
      const btnAdminUnban = document.getElementById('btn-admin-unban');
      if (btnAdminUnban) {
        btnAdminUnban.onclick = () => {
          const targetId = document.getElementById('admin-target-id').value;
          if (!targetId) return;
          const users = getStored("relook_users", DEFAULT_USERS);
          if (users[targetId]) {
            users[targetId].blocked = false;
            users[targetId].nickname = `user_${targetId}`;
            saveStored("relook_users", users);
            showToast("Админ", "Пользователь разблокирован!");
          }
        };
      }
      const btnAdminRestrict = document.getElementById('btn-admin-restrict');
      if (btnAdminRestrict) {
        btnAdminRestrict.onclick = () => {
          const targetId = document.getElementById('admin-target-id').value;
          if (!targetId) return;
          const users = getStored("relook_users", DEFAULT_USERS);
          if (users[targetId]) {
            users[targetId].restricted = true;
            saveStored("relook_users", users);
            showToast("Админ", "Действия пользователя ограничены.");
          }
        };
      }
      const btnAdminUnrestrict = document.getElementById('btn-admin-unrestrict');
      if (btnAdminUnrestrict) {
        btnAdminUnrestrict.onclick = () => {
          const targetId = document.getElementById('admin-target-id').value;
          if (!targetId) return;
          const users = getStored("relook_users", DEFAULT_USERS);
          if (users[targetId]) {
            users[targetId].restricted = false;
            saveStored("relook_users", users);
            showToast("Админ", "Ограничения сняты.");
          }
        };
      }
      const btnAdminWarn = document.getElementById('btn-admin-send-warning');
      if (btnAdminWarn) {
        btnAdminWarn.onclick = () => {
          const targetId = document.getElementById('admin-target-id').value;
          const text = document.getElementById('admin-warning-text').value;
          if (!targetId || !text) return;
          const users = getStored("relook_users", DEFAULT_USERS);
          if (users[targetId]) {
            users[targetId].warnings.push(text);
            saveStored("relook_users", users);
            showToast("Админ", "Предупреждение отправлено.");
          }
        };
      }
      const btnAdminGenPromo = document.getElementById('btn-admin-gen-promo');
      if (btnAdminGenPromo) {
        btnAdminGenPromo.onclick = () => {
          const type = document.getElementById('admin-promo-type').value;
          const days = document.getElementById('admin-promo-days').value;
          const promo = "REL-" + Math.random().toString(36).substr(2, 6).toUpperCase();
          
          const codes = getStored("relook_promocodes", DEFAULT_PROMOCODES);
          codes.push({
            code: promo,
            type: type,
            duration: days === '30' ? '1 месяц' : days === '90' ? '3 месяца' : '6 месяцев',
            durationDays: Number(days)
          });
          saveStored("relook_promocodes", codes);

          const resDiv = document.getElementById('admin-promo-result');
          const promoDisplay = document.getElementById('display-generated-promo');
          if (resDiv) resDiv.classList.remove('hidden');
          if (promoDisplay) promoDisplay.innerText = promo;
        };
      }

      // Support stream actions (replies)
      document.querySelectorAll('.btn-admin-reply').forEach(btn => {
        btn.onclick = () => {
          const uid = btn.getAttribute('data-reply-userId');
          const inp = document.getElementById(`reply-to-${uid}`);
          if (!inp || !inp.value.trim()) return;

          const support = getStored("relook_support", []);
          support.push({
            id: generateId(),
            userId: uid,
            sender: "admin",
            text: inp.value,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            date: new Date().toLocaleDateString("ru-RU")
          });
          saveStored("relook_support", support);
          inp.value = '';
          showToast("Админ", "Ответ отправлен пользователю!");
          render();
        };
      });

      // Profile details triggers
      const btnViewReviews = document.getElementById('btn-view-reviews');
      if (btnViewReviews) {
        btnViewReviews.onclick = () => document.getElementById('reviews-modal').classList.remove('hidden');
      }
      const btnCloseReviews = document.getElementById('btn-close-reviews');
      if (btnCloseReviews) {
        btnCloseReviews.onclick = () => document.getElementById('reviews-modal').classList.add('hidden');
      }
      const btnEditProfileTrigger = document.getElementById('btn-edit-profile-trigger');
      if (btnEditProfileTrigger) {
        btnEditProfileTrigger.onclick = () => document.getElementById('edit-profile-modal').classList.remove('hidden');
      }
      const btnCloseEditProfile = document.getElementById('btn-close-edit-profile');
      if (btnCloseEditProfile) {
        btnCloseEditProfile.onclick = () => document.getElementById('edit-profile-modal').classList.add('hidden');
      }
      const btnSaveProfileData = document.getElementById('btn-save-profile-data');
      if (btnSaveProfileData) {
        btnSaveProfileData.onclick = () => {
          const newAvatar = document.getElementById('edit-avatar-input').value;
          const newNick = document.getElementById('edit-nickname-input').value;

          if (state.dbUser.avatar !== newAvatar && state.dbUser.subscription === 'free') {
            showToast("Премиум", "Смена аватарки доступна только подписчикам RePlus или RePremium.");
            return;
          }

          if (state.dbUser.avatar !== newAvatar) {
            const pending = getStored("relook_mod_avatars", []);
            pending.push({ userId: state.dbUser.id, avatar: newAvatar });
            saveStored("relook_mod_avatars", pending);
          }
          if (state.dbUser.nickname !== newNick) {
            const pending = getStored("relook_mod_nicknames", []);
            pending.push({ userId: state.dbUser.id, nickname: newNick });
            saveStored("relook_mod_nicknames", pending);
          }
          showToast("Модерация", "Изменения отправлены на проверку.");
          document.getElementById('edit-profile-modal').classList.add('hidden');
        };
      }

      // Back to feed
      const btnBackToFeed = document.getElementById('btn-back-to-feed');
      if (btnBackToFeed) {
        btnBackToFeed.onclick = () => {
          state.selectedSeller = null;
          state.currentTab = 'feed';
          render();
        };
      }

      // MODERATION ACTIONS (Admin)
      document.querySelectorAll('[data-avatar-approve]').forEach(btn => {
        btn.onclick = () => {
          const uid = btn.getAttribute('data-avatar-approve');
          const avatars = getStored("relook_mod_avatars", []);
          const found = avatars.find(a => a.userId === uid);
          if (found) {
            const users = getStored("relook_users", DEFAULT_USERS);
            users[uid].avatar = found.avatar;
            saveStored("relook_users", users);
          }
          const filtered = avatars.filter(a => a.userId !== uid);
          saveStored("relook_mod_avatars", filtered);
          showToast("Одобрено", "Аватар изменен.");
          render();
        };
      });
      document.querySelectorAll('[data-avatar-decline]').forEach(btn => {
        btn.onclick = () => {
          const uid = btn.getAttribute('data-avatar-decline');
          const avatars = getStored("relook_mod_avatars", []);
          const filtered = avatars.filter(a => a.userId !== uid);
          saveStored("relook_mod_avatars", filtered);
          showToast("Отклонено", "Запрос отклонен.");
          render();
        };
      });
      document.querySelectorAll('[data-nick-approve]').forEach(btn => {
        btn.onclick = () => {
          const uid = btn.getAttribute('data-nick-approve');
          const nicks = getStored("relook_mod_nicknames", []);
          const found = nicks.find(n => n.userId === uid);
          if (found) {
            const users = getStored("relook_users", DEFAULT_USERS);
            users[uid].nickname = found.nickname;
            saveStored("relook_users", users);
          }
          const filtered = nicks.filter(n => n.userId !== uid);
          saveStored("relook_mod_nicknames", filtered);
          showToast("Одобрено", "Никнейм изменен.");
          render();
        };
      });
      document.querySelectorAll('[data-nick-decline]').forEach(btn => {
        btn.onclick = () => {
          const uid = btn.getAttribute('data-nick-decline');
          const nicks = getStored("relook_mod_nicknames", []);
          const filtered = nicks.filter(n => n.userId !== uid);
          saveStored("relook_mod_nicknames", filtered);
          showToast("Отклонено", "Никнейм отклонен.");
          render();
        };
      });
      document.querySelectorAll('[data-list-approve]').forEach(btn => {
        btn.onclick = () => {
          const lid = btn.getAttribute('data-list-approve');
          const listings = getStored("relook_listings", DEFAULT_LISTINGS);
          const idx = listings.findIndex(l => l.id === lid);
          if (idx !== -1) {
            listings[idx].status = 'active';
            saveStored("relook_listings", listings);
            showToast("Одобрено", "Объявление допущено к продажам.");
          }
          render();
        };
      });
      document.querySelectorAll('[data-list-decline]').forEach(btn => {
        btn.onclick = () => {
          const lid = btn.getAttribute('data-list-decline');
          const listings = getStored("relook_listings", DEFAULT_LISTINGS);
          const idx = listings.findIndex(l => l.id === lid);
          if (idx !== -1) {
            listings[idx].status = 'blocked';
            saveStored("relook_listings", listings);
            showToast("Заблокировано", "Объявление заблокировано.");
          }
          render();
        };
      });

      // CREATE LISTING FLOW HANDLERS
      const btnFloatingCreate = document.getElementById('btn-floating-create');
      if (btnFloatingCreate) {
        btnFloatingCreate.onclick = () => {
          if (state.dbUser.restricted) {
            showToast("Ограничение", "Вы временно ограничены и не можете создавать объявления.");
            return;
          }
          updateState({ showCreateModal: true, createStep: 1 });
        };
      }
      const btnCloseCreate = document.getElementById('btn-close-create-modal');
      if (btnCloseCreate) {
        btnCloseCreate.onclick = () => updateState({ showCreateModal: false });
      }
      const btnCreateNext = document.getElementById('btn-create-next');
      if (btnCreateNext) {
        btnCreateNext.onclick = () => {
          const step = state.createStep;
          if (step === 1) {
            state.createFormData.title = document.getElementById('create-title').value;
            state.createFormData.city = document.getElementById('create-city').value;
            if (!state.createFormData.title) { showToast("Ошибка", "Заполните название"); return; }
          } else if (step === 2) {
            const inputs = document.querySelectorAll('.create-image-input');
            const arr = [];
            inputs.forEach(inp => arr.push(inp.value));
            state.createFormData.images = arr;
            if (arr.filter(Boolean).length === 0) { showToast("Ошибка", "Добавьте минимум одно фото"); return; }
          } else if (step === 3) {
            state.createFormData.condition = document.getElementById('create-condition').value;
            state.createFormData.color = document.getElementById('create-color').value;
            state.createFormData.size = document.getElementById('create-size').value;
            if (!state.createFormData.size) { showToast("Ошибка", "Укажите размер"); return; }
          } else if (step === 4) {
            state.createFormData.price = document.getElementById('create-price').value;
            const originalCheckbox = document.getElementById('create-original');
            if (originalCheckbox && originalCheckbox.checked) {
              if (state.dbUser.subscription === 'free') {
                showToast("Премиум", "Установка галочки оригинал доступна только RePlus и RePremium подписчикам.");
                return;
              }
              state.createFormData.isOriginal = true;
            } else {
              state.createFormData.isOriginal = false;
            }
            if (!state.createFormData.price) { showToast("Ошибка", "Укажите цену"); return; }
          } else if (step === 5) {
            state.createFormData.desc = document.getElementById('create-desc').value;
          }
          state.createStep += 1;
          render();
        };
      }
      const btnCreatePrev = document.getElementById('btn-create-prev');
      if (btnCreatePrev) {
        btnCreatePrev.onclick = () => {
          state.createStep -= 1;
          render();
        };
      }
      const btnAddImageRow = document.getElementById('btn-add-image-row');
      if (btnAddImageRow) {
        btnAddImageRow.onclick = () => {
          state.createFormData.images.push('');
          render();
        };
      }
      const btnCreateSubmit = document.getElementById('btn-create-submit');
      if (btnCreateSubmit) {
        btnCreateSubmit.onclick = () => {
          const data = state.createFormData;
          const listings = getStored("relook_listings", DEFAULT_LISTINGS);
          const newLot = {
            id: "LST-" + generateId(),
            title: data.title,
            price: Number(data.price),
            city: data.city || "Москва",
            description: data.desc,
            size: data.size,
            color: data.color || "Черный",
            condition: data.condition,
            original: data.isOriginal,
            sellerId: state.dbUser.id,
            images: data.images.filter(Boolean),
            status: 'pending'
          };
          listings.push(newLot);
          saveStored("relook_listings", listings);
          showToast("Модерация", "Лот успешно отправлен на модерацию!");
          updateState({ showCreateModal: false, createFormData: { title: '', images: [''], condition: 'Отличное', color: '', price: '', desc: '', size: '', city: '', isOriginal: false } });
        };
      }

      // AUTH EVENTS
      const tabAuthLogin = document.getElementById('tab-auth-login');
      if (tabAuthLogin) {
        tabAuthLogin.onclick = () => {
          state.authForm.mode = 'login';
          state.authForm.step = 1;
          state.authForm.error = '';
          render();
        };
      }
      const tabAuthRegister = document.getElementById('tab-auth-register');
      if (tabAuthRegister) {
        tabAuthRegister.onclick = () => {
          state.authForm.mode = 'register';
          state.authForm.step = 1;
          state.authForm.error = '';
          render();
        };
      }

      const btnAuthAction = document.getElementById('btn-auth-action');
      if (btnAuthAction) {
        btnAuthAction.onclick = async () => {
          const email = document.getElementById('auth-email').value;
          const pass = document.getElementById('auth-password').value;
          state.authForm.error = '';
          try {
            await signInWithEmailAndPassword(auth, email, pass);
          } catch (e) {
            state.authForm.error = "Ошибка входа: неверные данные или пользователь не существует.";
            render();
          }
        };
      }

      const btnRegNext1 = document.getElementById('btn-reg-next-1');
      if (btnRegNext1) {
        btnRegNext1.onclick = async () => {
          const email = document.getElementById('reg-email').value;
          const pass = document.getElementById('reg-password').value;
          if (!email || !pass || pass.length < 6) {
            state.authForm.error = "Введите email и надежный пароль (минимум 6 символов).";
            render();
            return;
          }
          try {
            const cred = await createUserWithEmailAndPassword(auth, email, pass);
            await sendEmailVerification(cred.user);
            state.authForm.email = email;
            state.authForm.password = pass;
            state.authForm.step = 2;
            state.authForm.error = '';
            showToast("Подтверждение", "Письмо отправлено на почту.");
            render();
          } catch (e) {
            state.authForm.error = "Ошибка Firebase: " + e.message;
            render();
          }
        };
      }

      const btnSimulateVerify = document.getElementById('btn-simulate-verify');
      if (btnSimulateVerify) {
        btnSimulateVerify.onclick = () => {
          state.authForm.step = 3;
          showToast("Подтверждено", "Почта успешно верифицирована.");
          render();
        };
      }

      const btnRegNext3 = document.getElementById('btn-reg-next-3');
      if (btnRegNext3) {
        btnRegNext3.onclick = () => {
          const nick = document.getElementById('reg-nickname').value;
          if (!nick) {
            state.authForm.error = "Введите никнейм";
            render();
            return;
          }
          state.authForm.nickname = nick;
          state.authForm.step = 4;
          state.authForm.error = '';
          render();
        };
      }

      const btnRegNext4 = document.getElementById('btn-reg-next-4');
      if (btnRegNext4) {
        btnRegNext4.onclick = () => {
          const conf = document.getElementById('reg-confirm').value;
          if (conf !== state.authForm.password) {
            state.authForm.error = "Пароли не совпадают!";
            render();
            return;
          }
          state.authForm.confirmPassword = conf;
          state.authForm.step = 5;
          state.authForm.error = '';
          render();
        };
      }

      const regAgree = document.getElementById('reg-agree');
      if (regAgree) {
        regAgree.onchange = (e) => {
          state.authForm.agreed = e.target.checked;
          const completeBtn = document.getElementById('btn-reg-complete');
          if (completeBtn) completeBtn.disabled = !e.target.checked;
        };
      }

      const btnRegComplete = document.getElementById('btn-reg-complete');
      if (btnRegComplete) {
        btnRegComplete.onclick = () => {
          const users = getStored("relook_users", DEFAULT_USERS);
          const newId = generateId();
          const localUser = {
            id: newId,
            email: state.authForm.email,
            nickname: state.authForm.nickname,
            avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150",
            subscription: "free",
            expiry: null,
            regDate: new Date().toLocaleDateString("ru-RU"),
            rating: 5.0,
            reviewsCount: 0,
            warnings: [],
            restricted: false,
            blocked: false,
            lastSeen: "В сети"
          };
          users[newId] = localUser;
          saveStored("relook_users", users);
          state.dbUser = localUser;
          state.firebaseUser = auth.currentUser;
          updateState({ currentTab: 'feed' });
        };
      }

      // DISMISS WARNING
      const btnDismissWarning = document.getElementById('btn-dismiss-warning');
      if (btnDismissWarning) {
        btnDismissWarning.onclick = () => {
          const users = getStored("relook_users", DEFAULT_USERS);
          users[state.dbUser.id].warnings = [];
          saveStored("relook_users", users);
          state.dbUser.warnings = [];
          render();
        };
      }

      // LOGOUT
      const btnLogout = document.getElementById('btn-logout');
      if (btnLogout) {
        btnLogout.onclick = async () => {
          await signOut(auth);
          updateState({ firebaseUser: null, dbUser: null, currentTab: 'feed', activeChat: null, selectedListing: null });
        };
      }
    };

    // Initial Render Call
    render();
  </script>
</body>
</html>
