<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relook - Ресейл площадка нового поколения</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            forest: {
              50: '#f2f8f6',
              100: '#e1ede9',
              500: '#0B2F23',
              600: '#08241a',
              700: '#061a13',
              800: '#04110d',
              900: '#020907',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    /* Анимация переливания для RePremium */
    @keyframes premium-glow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .repremium-gradient {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: premium-glow 15s ease infinite;
    }
    .repremium-text {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 300% 300%;
      animation: premium-glow 8s ease infinite;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* Стили полосы прокрутки */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-zinc-950 dark:text-zinc-100 transition-colors duration-200">

  <div id="root"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut, 
      sendEmailVerification,
      signInWithCustomToken,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      query, 
      onSnapshot, 
      addDoc, 
      updateDoc, 
      deleteDoc,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Инициализация React в глобальном контексте
    import React, { useState, useEffect, useRef } from "https://esm.sh/react@18.2.0";
    import ReactDOM from "https://esm.sh/react-dom@18.2.0/client";

    // Firebase Config (переданный пользователем)
    const firebaseConfig = {
      apiKey: "AIzaSyAt9RopDjGhGarn-NxlH1Uzf2PFtcQ14Ds",
      authDomain: "relook-a0a12.firebaseapp.com",
      projectId: "relook-a0a12",
      storageBucket: "relook-a0a12.firebasestorage.app",
      messagingSenderId: "199638240697",
      appId: "1:199638240697:web:c7bca3f27737057f37ba68",
      measurementId: "G-J633VVYTF7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "relook-main"; // Стандартизированный ID приложения

    // Компонент App
    function App() {
      // Состояния авторизации и профиля
      const [user, setUser] = useState(null);
      const [userProfile, setUserProfile] = useState(null);
      const [authStep, setAuthStep] = useState('login'); // login, register, email_pending, nickname, password_setup, rules_agreement
      const [loading, setLoading] = useState(true);
      const [checkingEmail, setCheckingEmail] = useState(false);

      // Временные данные регистрации
      const [regEmail, setRegEmail] = useState('');
      const [regTempPass, setRegTempPass] = useState('');
      const [regNickname, setRegNickname] = useState('');
      const [regPass1, setRegPass1] = useState('');
      const [regPass2, setRegPass2] = useState('');

      // Ввод логина
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');

      // Ошибки
      const [authError, setAuthError] = useState('');

      // Глобальная тема
      const [theme, setTheme] = useState('dark'); // dark, light
      const [accentColor, setAccentColor] = useState('forest'); // forest, blue, red (для RePremium)

      // Навигация
      const [currentTab, setCurrentTab] = useState('main'); // main, my_items, support, premium, settings, admin
      
      // Данные из Firestore
      const [listings, setListings] = useState([]);
      const [users, setUsers] = useState([]);
      const [chats, setChats] = useState([]);
      const [messages, setMessages] = useState([]);
      const [reviews, setReviews] = useState([]);
      const [systemSettings, setSystemSettings] = useState({ promoCodes: [] });

      // Активные элементы интерфейса
      const [selectedListing, setSelectedListing] = useState(null);
      const [activeChat, setActiveChat] = useState(null);
      const [selectedUser, setSelectedUser] = useState(null); // Просмотр чужого профиля
      const [chatSearchText, setChatSearchText] = useState('');
      const [messageInput, setMessageInput] = useState('');

      // Модальные окна и формы
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);
      const [editingListing, setEditingListing] = useState(null);
      const [showReviewModal, setShowReviewModal] = useState(false);
      const [reviewForm, setReviewForm] = useState({ rating: 5, text: '', listingId: '', dealSuccess: 'yes' });
      const [showPromoModal, setShowPromoModal] = useState(false);
      const [promoInput, setPromoInput] = useState('');
      const [promoSuccessMsg, setPromoSuccessMsg] = useState('');
      
      // Контекстное меню чата
      const [showChatMenu, setShowChatMenu] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);
      const [reportForm, setReportForm] = useState({ messageId: '', reason: '' });

      // Ограничение чата или предупреждения
      const [warningModalText, setWarningModalText] = useState('');

      // Форма создания объявления (по шагам)
      const [createStep, setCreateStep] = useState(1);
      const [newListing, setNewListing] = useState({
        title: '',
        images: [''],
        condition: 'Отличное',
        color: '',
        price: '',
        description: '',
        city: 'Москва',
        isOriginal: false
      });

      // Редактирование своего профиля
      const [showEditProfileModal, setShowEditProfileModal] = useState(false);
      const [editProfileForm, setEditProfileForm] = useState({ nickname: '', avatarUrl: '' });

      // Локальные кастомные всплывающие сообщения (вместо alert)
      const [toast, setToast] = useState(null);

      // Ссылка для скроллинга чата
      const chatEndRef = useRef(null);

      // Инициализация темы при монтировании
      useEffect(() => {
        const savedTheme = localStorage.getItem('relook_theme') || 'dark';
        setTheme(savedTheme);
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, []);

      // Показ тоста
      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Проверка авторизации на старте
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, async (firebaseUser) => {
          if (firebaseUser) {
            // Если почта не подтверждена, заставляем подтвердить
            if (!firebaseUser.emailVerified && firebaseUser.email !== 'sobakastalina123@gmail.com') {
              setUser(firebaseUser);
              setAuthStep('email_pending');
              setLoading(false);
              return;
            }

            // Получаем или создаем профиль в Firestore
            const profileRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', firebaseUser.uid);
            const docSnap = await getDoc(profileRef);

            if (docSnap.exists()) {
              const data = docSnap.data();
              setUserProfile(data);
              
              // Запоминаем кастомную тему для RePremium
              if (data.subscriptionType === 'repremium' && data.accentColor) {
                setAccentColor(data.accentColor);
              }

              // Проверка бана
              if (data.isBanned) {
                setAuthStep('banned');
              } else {
                setUser(firebaseUser);
                setAuthStep('done');
              }
            } else {
              // Если новый зарегистрированный юзер без профиля
              setUser(firebaseUser);
              setAuthStep('nickname');
            }
          } else {
            setUser(null);
            setUserProfile(null);
            setAuthStep('login');
          }
          setLoading(false);
        });

        return () => unsubscribe();
      }, []);

      // Автоматическая проверка верификации почты каждые 3 секунды, если мы на шаге ожидания
      useEffect(() => {
        let interval;
        if (authStep === 'email_pending' && user) {
          interval = setInterval(async () => {
            await user.reload();
            if (user.emailVerified) {
              clearInterval(interval);
              // Переходим на ввод никнейма
              setAuthStep('nickname');
            }
          }, 3000);
        }
        return () => clearInterval(interval);
      }, [authStep, user]);

      // Подписка на глобальные данные (Пользователи, Объявления, Чаты, Отзывы)
      useEffect(() => {
        if (!user || authStep !== 'done') return;

        // 1. Все объявления
        const listingsQuery = collection(db, 'artifacts', appId, 'public', 'data', 'listings');
        const unsubListings = onSnapshot(listingsQuery, (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
          setListings(list);
        }, (err) => console.error("Listings error:", err));

        // 2. Все пользователи
        const usersQuery = collection(db, 'artifacts', appId, 'public', 'data', 'users');
        const unsubUsers = onSnapshot(usersQuery, (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
          setUsers(list);

          // Обновляем текущий профиль из этого списка
          const myProfile = list.find(u => u.id === user.uid);
          if (myProfile) {
            setUserProfile(myProfile);
            if (myProfile.isBanned) {
              setAuthStep('banned');
            }
            if (myProfile.warning && myProfile.warning !== '') {
              setWarningModalText(myProfile.warning);
              // Сбрасываем предупреждение в базе, чтобы не надоедало при каждом обновлении
              updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), {
                warning: ''
              });
            }
          }
        }, (err) => console.error("Users error:", err));

        // 3. Все отзывы
        const reviewsQuery = collection(db, 'artifacts', appId, 'public', 'data', 'reviews');
        const unsubReviews = onSnapshot(reviewsQuery, (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
          setReviews(list);
        }, (err) => console.error("Reviews error:", err));

        // 4. Все чаты
        const chatsQuery = collection(db, 'artifacts', appId, 'public', 'data', 'chats');
        const unsubChats = onSnapshot(chatsQuery, (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => {
            const data = doc.data();
            // Пользователь должен быть участником чата ИЛИ быть админом для саппорт-чатов
            const isParticipant = data.participants && data.participants.includes(user.uid);
            const isSupportChatForAdmin = data.isSupport && user.email === 'sobakastalina123@gmail.com';
            
            if (isParticipant || isSupportChatForAdmin) {
              list.push({ id: doc.id, ...data });
            }
          });
          setListings(prevListings => {
            // Сортировка чатов с учетом закрепления
            return list; 
          });
          setChats(list);
        }, (err) => console.error("Chats error:", err));

        // 5. Все сообщения
        const msgsQuery = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
        const unsubMsgs = onSnapshot(msgsQuery, (snapshot) => {
          const list = [];
          snapshot.forEach((doc) => list.push({ id: doc.id, ...doc.data() }));
          // Сортируем по времени
          list.sort((a, b) => a.timestamp - b.timestamp);
          setMessages(list);
        }, (err) => console.error("Messages error:", err));

        // 6. Системные настройки (промокоды)
        const sysQuery = doc(db, 'artifacts', appId, 'public', 'data', 'system');
        const unsubSys = onSnapshot(sysQuery, (docSnap) => {
          if (docSnap.exists()) {
            setSystemSettings(docSnap.data());
          } else {
            // Инициализация
            setDoc(sysQuery, { promoCodes: [] });
          }
        });

        // Каждую минуту обновляем статус активности "В сети" в БД
        const updateOnlineStatus = () => {
          const ref = doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid);
          updateDoc(ref, { lastSeen: Date.now() }).catch(() => {});
        };
        updateOnlineStatus();
        const onlineInterval = setInterval(updateOnlineStatus, 30000);

        return () => {
          unsubListings();
          unsubUsers();
          unsubReviews();
          unsubChats();
          unsubMsgs();
          unsubSys();
          clearInterval(onlineInterval);
        };
      }, [user, authStep]);

      // Прокрутка чата вниз при новых сообщениях
      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, activeChat]);

      // Хелпер: Получить имя пользователя по ID
      const getUserName = (uid) => {
        const u = users.find(x => x.id === uid);
        if (!u) return 'Загрузка...';
        return u.isBanned ? 'Аккаунт заблокирован' : u.nickname;
      };

      // Хелпер: Получить аватарку по ID
      const getUserAvatar = (uid) => {
        const u = users.find(x => x.id === uid);
        if (!u) return 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop';
        return u.avatarUrl || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop';
      };

      // Хелпер: Получить подписку по ID
      const getUserSub = (uid) => {
        const u = users.find(x => x.id === uid);
        return u ? u.subscriptionType || 'free' : 'free';
      };

      // --- ЛОГИКА АВТОРИЗАЦИИ ---

      // Кнопка Регистрация (Шаг 1: Почта)
      const handleRegisterStep1 = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!regEmail) {
          setAuthError('Введите почту');
          return;
        }

        // Временный пароль для первой регистрации в Firebase
        const tempPassword = Math.random().toString(36).slice(-10) + "A1!";
        setRegTempPass(tempPassword);

        try {
          const userCredential = await createUserWithEmailAndPassword(auth, regEmail, tempPassword);
          const fbUser = userCredential.user;
          
          // Отправляем настоящее письмо подтверждения
          await sendEmailVerification(fbUser);
          
          setUser(fbUser);
          setAuthStep('email_pending');
          showToast('Письмо с подтверждением отправлено на вашу почту!', 'success');
        } catch (error) {
          console.error(error);
          setAuthError(getFriendlyError(error.code));
        }
      };

      // Кнопка Вход
      const handleLogin = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!loginEmail || !loginPass) {
          setAuthError('Заполните все поля');
          return;
        }
        try {
          const userCredential = await signInWithEmailAndPassword(auth, loginEmail, loginPass);
          const fbUser = userCredential.user;

          // Если это не админ и почта не верифицирована
          if (!fbUser.emailVerified && loginEmail !== 'sobakastalina123@gmail.com') {
            await sendEmailVerification(fbUser);
            setUser(fbUser);
            setAuthStep('email_pending');
            showToast('Пожалуйста, подтвердите вашу почту. Письмо отправлено повторно.', 'warning');
          }
        } catch (error) {
          console.error(error);
          setAuthError(getFriendlyError(error.code));
        }
      };

      // Шаг ввода никнейма
      const handleSaveNickname = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (!regNickname.trim()) {
          setAuthError('Введите никнейм');
          return;
        }
        // Проверка уникальности никнейма
        const isTaken = users.some(u => u.nickname?.toLowerCase() === regNickname.trim().toLowerCase());
        if (isTaken) {
          setAuthError('Этот никнейм уже занят');
          return;
        }
        // Переходим к установке пароля
        setAuthStep('password_setup');
      };

      // Шаг установки финального пароля
      const handleSavePassword = async (e) => {
        e.preventDefault();
        setAuthError('');
        if (regPass1.length < 6) {
          setAuthError('Пароль должен быть не менее 6 символов');
          return;
        }
        if (regPass1 !== regPass2) {
          setAuthError('Пароли не совпадают');
          return;
        }

        try {
          // Обновляем пароль в Firebase Auth
          await auth.currentUser.updatePassword(regPass1);
          // Переходим к правилам
          setAuthStep('rules_agreement');
        } catch (error) {
          setAuthError(getFriendlyError(error.code));
        }
      };

      // Согласие с правилами и создание финального профиля в Firestore
      const handleAgreeRules = async () => {
        try {
          const uid = auth.currentUser.uid;
          const isAdministrator = auth.currentUser.email === 'sobakastalina123@gmail.com';
          
          const profileData = {
            nickname: isAdministrator ? 'Администратор Relook' : regNickname,
            avatarUrl: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop',
            avatarPendingUrl: '',
            avatarStatus: 'approved', // approved, pending, rejected
            nicknamePending: '',
            nicknameStatus: 'approved',
            subscriptionType: isAdministrator ? 'repremium' : 'free', // free, replus, repremium
            subExpiry: 0,
            registrationDate: Date.now(),
            rating: 5.0,
            reviewsCount: 0,
            isBanned: false,
            isRestricted: false,
            warning: '',
            lastSeen: Date.now()
          };

          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uid), profileData);
          setUserProfile(profileData);
          setAuthStep('done');
          showToast('Регистрация успешно завершена!', 'success');
        } catch (error) {
          console.error(error);
          showToast('Ошибка сохранения профиля: ' + error.message, 'error');
        }
      };

      const handleLogout = () => {
        signOut(auth).then(() => {
          setAuthStep('login');
          setUser(null);
          setUserProfile(null);
          setCurrentTab('main');
          setSelectedListing(null);
          setActiveChat(null);
        });
      };

      const getFriendlyError = (code) => {
        switch (code) {
          case 'auth/invalid-email': return 'Неверный формат почты';
          case 'auth/user-not-found': return 'Пользователь не найден';
          case 'auth/wrong-password': return 'Неверный пароль';
          case 'auth/email-already-in-use': return 'Эта почта уже зарегистрирована';
          case 'auth/weak-password': return 'Слишком слабый пароль';
          default: return 'Произошла ошибка. Попробуйте еще раз.';
        }
      };

      // --- ЛОГИКА ОБЪЯВЛЕНИЙ ---

      // Создание объявления (Пошагово)
      const handleCreateListing = async () => {
        if (userProfile?.isRestricted) {
          showToast('Ваш аккаунт ограничен! Вы не можете создавать объявления.', 'error');
          return;
        }

        // Проверка галочки оригинал
        if (newListing.isOriginal) {
          const sub = userProfile?.subscriptionType || 'free';
          if (sub === 'free') {
            showToast('Галочка "Оригинал" доступна только для RePlus и RePremium!', 'warning');
            return;
          }
          // Лимиты: replus - 2 в месяц, repremium - 5 в неделю (упрощенная проверка в рамках прототипа)
        }

        try {
          const listingData = {
            title: newListing.title,
            images: newListing.images.filter(img => img.trim() !== ''),
            condition: newListing.condition,
            color: newListing.color,
            price: Number(newListing.price),
            description: newListing.description,
            city: newListing.city,
            isOriginal: newListing.isOriginal,
            ownerId: user.uid,
            status: 'на проверке', // активен, на проверке, заблокирован
            createdAt: Date.now(),
            views: 0
          };

          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'listings'), listingData);
          showToast('Объявление отправлено на модерацию!', 'success');
          setShowCreateModal(false);
          // Сброс формы
          setNewListing({
            title: '',
            images: [''],
            condition: 'Отличное',
            color: '',
            price: '',
            description: '',
            city: 'Москва',
            isOriginal: false
          });
          setCreateStep(1);
        } catch (error) {
          showToast('Ошибка создания объявления: ' + error.message, 'error');
        }
      };

      // Удаление своего объявления
      const handleDeleteListing = async (listingId) => {
        if (window.confirm('Вы точно хотите удалить объявление? вернуть его никак не получится.')) {
          try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', listingId));
            showToast('Объявление удалено навсегда', 'success');
            setSelectedListing(null);
            setShowEditModal(false);
          } catch (error) {
            showToast('Ошибка удаления: ' + error.message, 'error');
          }
        }
      };

      // Сохранение отредактированного объявления
      const handleSaveEditedListing = async () => {
        try {
          const ref = doc(db, 'artifacts', appId, 'public', 'data', 'listings', editingListing.id);
          await updateDoc(ref, {
            title: editingListing.title,
            price: Number(editingListing.price),
            description: editingListing.description,
            condition: editingListing.condition,
            color: editingListing.color,
            city: editingListing.city,
            images: editingListing.images.filter(i => i.trim() !== ''),
            status: 'на проверке' // Снова на проверку после редактирования
          });
          showToast('Объявление обновлено и отправлено на проверку', 'success');
          setShowEditModal(false);
          setSelectedListing(null);
        } catch (error) {
          showToast('Ошибка обновления: ' + error.message, 'error');
        }
      };

      // --- ЛОГИКА ПОДПИСОК И ПРОМОКОДОВ ---

      const handleApplyPromo = async () => {
        if (!promoInput.trim()) return;
        
        const sysRef = doc(db, 'artifacts', appId, 'public', 'data', 'system');
        const currentPromos = systemSettings.promoCodes || [];
        
        const foundIndex = currentPromos.findIndex(p => p.code.toLowerCase() === promoInput.trim().toLowerCase());
        
        if (foundIndex === -1) {
          showToast('Такой промокод не найден', 'error');
          return;
        }

        const promo = currentPromos[foundIndex];
        
        // Начисление подписки
        let durationMs = 30 * 24 * 60 * 60 * 1000; // 1 месяц по умолчанию
        if (promo.duration === '3 месяца') durationMs = 90 * 24 * 60 * 60 * 1000;
        if (promo.duration === '6 месяцев') durationMs = 180 * 24 * 60 * 60 * 1000;

        const newExpiry = Date.now() + durationMs;

        try {
          // Обновляем профиль пользователя
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), {
            subscriptionType: promo.type, // replus или repremium
            subExpiry: newExpiry
          });

          // Удаляем использованный промокод из базы
          const updatedPromos = [...currentPromos];
          updatedPromos.splice(foundIndex, 1);
          await updateDoc(sysRef, { promoCodes: updatedPromos });

          setPromoSuccessMsg(`Поздравляем! Вы активировали подписку ${promo.type.toUpperCase()} на ${promo.duration}!`);
          setPromoInput('');
          showToast('Промокод успешно активирован!', 'success');
        } catch (error) {
          showToast('Ошибка активации: ' + error.message, 'error');
        }
      };

      // Смена акцентного цвета (только RePremium)
      const handleSetAccentColor = async (color) => {
        if (userProfile?.subscriptionType !== 'repremium') {
          showToast('Кастомизация цвета доступна только для RePremium!', 'warning');
          return;
        }
        setAccentColor(color);
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid), {
          accentColor: color
        });
      };

      // --- ЛОГИКА ЧАТОВ ---

      const handleStartChat = async (listing) => {
        if (listing.ownerId === user.uid) {
          showToast('Это ваше собственное объявление!', 'info');
          return;
        }

        // Ищем существующий чат по этому объявлению между этими юзерами
        const existingChat = chats.find(c => 
          c.listingId === listing.id && 
          c.participants?.includes(user.uid) && 
          c.participants?.includes(listing.ownerId) &&
          !c.isSupport
        );

        if (existingChat) {
          setActiveChat(existingChat);
          setCurrentTab('support'); // Таб с сообщениями
          return;
        }

        // Создаем новый чат
        try {
          const chatData = {
            listingId: listing.id,
            listingTitle: listing.title,
            listingPrice: listing.price,
            listingImage: listing.images[0] || '',
            participants: [user.uid, listing.ownerId],
            isSupport: false,
            pinnedBy: [],
            mutedBy: [],
            blockedBy: [],
            createdAt: Date.now()
          };

          const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chats'), chatData);
          setActiveChat({ id: docRef.id, ...chatData });
          setCurrentTab('support');
        } catch (error) {
          showToast('Ошибка создания чата: ' + error.message, 'error');
        }
      };

      // Чат поддержки
      const handleStartSupportChat = async () => {
        const supportChat = chats.find(c => c.isSupport && c.participants?.includes(user.uid));
        if (supportChat) {
          setActiveChat(supportChat);
          return;
        }

        try {
          const chatData = {
            isSupport: true,
            participants: [user.uid],
            pinnedBy: [],
            createdAt: Date.now()
          };
          const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'chats'), chatData);
          setActiveChat({ id: docRef.id, ...chatData });
        } catch (error) {
          showToast('Ошибка открытия поддержки: ' + error.message, 'error');
        }
      };

      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!messageInput.trim() || !activeChat) return;

        if (userProfile?.isRestricted) {
          showToast('Ваш аккаунт временно ограничен в отправке сообщений.', 'error');
          return;
        }

        // Проверка блокировки в чате
        if (activeChat.blockedBy && activeChat.blockedBy.length > 0) {
          showToast('Чат заблокирован одним из участников.', 'error');
          return;
        }

        try {
          const msgData = {
            chatId: activeChat.id,
            senderId: user.uid,
            senderNickname: userProfile?.nickname || 'Пользователь',
            senderAvatar: userProfile?.avatarUrl || '',
            text: messageInput.trim(),
            timestamp: Date.now()
          };

          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), msgData);
          setMessageInput('');

          // Эмуляция пуш-уведомления другой стороне, если у нее включены уведомления
          // Мы просто запишем в БД событие нового сообщения, или проверим статус muted у получателя
          const recipientId = activeChat.participants?.find(p => p !== user.uid);
          if (recipientId) {
            const recipientProfile = users.find(u => u.id === recipientId);
            const isMuted = activeChat.mutedBy?.includes(recipientId);
            if (!isMuted && recipientProfile) {
              // Имитируем отправку
              console.log(`Notification sent to ${recipientProfile.nickname}`);
            }
          }
        } catch (error) {
          showToast('Ошибка отправки: ' + error.message, 'error');
        }
      };

      // Ответ поддержки от Админа (синтаксис @айди текст)
      const handleAdminSupportReply = async (e) => {
        e.preventDefault();
        if (!messageInput.trim() || !activeChat) return;

        const match = messageInput.trim().match(/^@([a-zA-Z0-9_-]+)\s+(.+)$/);
        if (!match) {
          showToast('Для ответа в саппорт напишите в формате: @ID_пользователя Ваш ответ', 'warning');
          return;
        }

        const targetUserId = match[1];
        const replyText = match[2];

        // Ищем чат поддержки этого юзера
        const userSupportChat = chats.find(c => c.isSupport && c.participants?.includes(targetUserId));
        if (!userSupportChat) {
          showToast('Чат поддержки с таким пользователем не найден', 'error');
          return;
        }

        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'messages'), {
            chatId: userSupportChat.id,
            senderId: user.uid,
            senderNickname: 'Поддержка Relook',
            senderAvatar: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=100&auto=format&fit=crop',
            text: replyText,
            timestamp: Date.now()
          });
          setMessageInput('');
          showToast('Ответ отправлен пользователю', 'success');
        } catch (error) {
          showToast('Ошибка отправки: ' + error.message, 'error');
        }
      };

      // Закрепить чат
      const togglePinChat = async (chat) => {
        const sub = userProfile?.subscriptionType || 'free';
        const pinned = chat.pinnedBy || [];
        const isPinned = pinned.includes(user.uid);

        let limit = 1;
        if (sub === 'replus') limit = 8;
        if (sub === 'repremium') limit = 50;

        const myPinnedChatsCount = chats.filter(c => c.pinnedBy?.includes(user.uid)).length;

        if (!isPinned && myPinnedChatsCount >= limit) {
          showToast(`Лимит закрепленных чатов для подписки ${sub.toUpperCase()}: ${limit}`, 'warning');
          return;
        }

        const newPinned = isPinned 
          ? pinned.filter(u => u !== user.uid)
          : [...pinned, user.uid];

        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', chat.id), {
          pinnedBy: newPinned
        });
        showToast(isPinned ? 'Чат откреплен' : 'Чат закреплен', 'success');
      };

      // Mute (Уведомления)
      const toggleMuteChat = async (chat) => {
        const muted = chat.mutedBy || [];
        const isMuted = muted.includes(user.uid);

        const newMuted = isMuted 
          ? muted.filter(u => u !== user.uid)
          : [...muted, user.uid];

        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', chat.id), {
          mutedBy: newMuted
        });
        showToast(isMuted ? 'Уведомления включены' : 'Уведомления выключены', 'success');
      };

      // Заблокировать чат (Только RePlus и RePremium)
      const toggleBlockChat = async (chat) => {
        const sub = userProfile?.subscriptionType || 'free';
        if (sub === 'free') {
          showToast('Функция блокировки собеседника доступна только подписчикам RePlus и RePremium!', 'warning');
          return;
        }

        const blocked = chat.blockedBy || [];
        const isBlocked = blocked.includes(user.uid);

        const newBlocked = isBlocked 
          ? blocked.filter(u => u !== user.uid)
          : [...blocked, user.uid];

        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', chat.id), {
          blockedBy: newBlocked
        });
        showToast(isBlocked ? 'Чат разблокирован' : 'Собеседник заблокирован', 'success');
      };

      // Удалить чат навсегда у каждого (Только RePremium)
      const handleDeleteChatForever = async (chat) => {
        const sub = userProfile?.subscriptionType || 'free';
        if (sub !== 'repremium') {
          showToast('Удаление чата для обоих участников доступно только для RePremium!', 'warning');
          return;
        }

        if (window.confirm('Вы точно хотите удалить чат навсегда для всех участников? Восстановить его не получится.')) {
          try {
            // Удаляем сообщения этого чата
            const chatMsgs = messages.filter(m => m.chatId === chat.id);
            for (let m of chatMsgs) {
              await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'messages', m.id));
            }
            // Удаляем сам чат
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'chats', chat.id));
            setActiveChat(null);
            showToast('Чат безвозвратно удален для обеих сторон', 'success');
          } catch (e) {
            showToast('Ошибка удаления: ' + e.message, 'error');
          }
        }
      };

      // Жалоба на сообщение
      const handleSendReport = async (e) => {
        e.preventDefault();
        if (!reportForm.messageId || !reportForm.reason) return;

        try {
          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reports'), {
            senderId: user.uid,
            messageId: reportForm.messageId,
            reason: reportForm.reason,
            chatId: activeChat.id,
            timestamp: Date.now()
          });
          setShowReportModal(false);
          setReportForm({ messageId: '', reason: '' });
          showToast('Жалоба успешно отправлена модераторам', 'success');
        } catch (e) {
          showToast('Ошибка отправки жалобы', 'error');
        }
      };

      // --- ЛОГИКА ОТЗЫВОВ ---

      const handleAddReview = async (e) => {
        e.preventDefault();
        try {
          const reviewData = {
            authorId: user.uid,
            targetUserId: selectedListing?.ownerId || activeChat?.participants?.find(p => p !== user.uid),
            listingId: reviewForm.listingId,
            rating: Number(reviewForm.rating),
            text: reviewForm.text,
            dealSuccess: reviewForm.dealSuccess,
            status: 'approved', // Для простоты сразу одобряем, админ может удалить
            createdAt: Date.now()
          };

          await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'reviews'), reviewData);
          
          // Обновляем рейтинг пользователя
          const targetId = reviewData.targetUserId;
          const userReviews = reviews.filter(r => r.targetUserId === targetId).concat(reviewData);
          const totalRating = userReviews.reduce((sum, r) => sum + r.rating, 0);
          const avgRating = Number((totalRating / userReviews.length).toFixed(2));

          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', targetId), {
            rating: avgRating,
            reviewsCount: userReviews.length
          });

          setShowReviewModal(false);
          setReviewForm({ rating: 5, text: '', listingId: '', dealSuccess: 'yes' });
          showToast('Отзыв отправлен!', 'success');
        } catch (error) {
          showToast('Ошибка отправки отзыва: ' + error.message, 'error');
        }
      };

      // --- РЕДАКТИРОВАНИЕ ПРОФИЛЯ ---

      const handleSaveProfile = async (e) => {
        e.preventDefault();
        const sub = userProfile?.subscriptionType || 'free';

        // Валидация на смену аватарки
        if (editProfileForm.avatarUrl !== userProfile.avatarUrl && sub === 'free') {
          showToast('Загрузка кастомных аватарок доступна только для RePlus и RePremium!', 'warning');
          return;
        }

        try {
          const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', user.uid);
          const updates = {};

          if (editProfileForm.nickname.trim() !== userProfile.nickname) {
            updates.nicknamePending = editProfileForm.nickname.trim();
            updates.nicknameStatus = 'pending';
          }

          if (editProfileForm.avatarUrl.trim() !== userProfile.avatarUrl) {
            updates.avatarPendingUrl = editProfileForm.avatarUrl.trim();
            updates.avatarStatus = 'pending';
          }

          if (Object.keys(updates).length > 0) {
            await updateDoc(userRef, updates);
            showToast('Изменения отправлены на модерацию!', 'success');
          }
          setShowEditProfileModal(false);
        } catch (error) {
          showToast('Ошибка сохранения: ' + error.message, 'error');
        }
      };

      // --- АДМИН-ПАНЕЛЬ ---

      const handleAdminApproveListing = async (listingId) => {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', listingId), {
          status: 'активен'
        });
        showToast('Объявление одобрено', 'success');
      };

      const handleAdminRejectListing = async (listingId) => {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', listingId), {
          status: 'заблокирован'
        });
        showToast('Объявление отклонено', 'warning');
      };

      const handleAdminBlockListingById = async (listingId) => {
        try {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'listings', listingId), {
            status: 'заблокирован'
          });
          showToast('Объявление заблокировано', 'success');
        } catch (e) {
          showToast('Объявление с таким ID не найдено', 'error');
        }
      };

      const handleAdminApproveAvatar = async (uId, url) => {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uId), {
          avatarUrl: url,
          avatarStatus: 'approved',
          avatarPendingUrl: ''
        });
        showToast('Аватар одобрен', 'success');
      };

      const handleAdminRejectAvatar = async (uId) => {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uId), {
          avatarStatus: 'rejected',
          avatarPendingUrl: ''
        });
        showToast('Аватар отклонен', 'warning');
      };

      const handleAdminApproveNickname = async (uId, nick) => {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uId), {
          nickname: nick,
          nicknameStatus: 'approved',
          nicknamePending: ''
        });
        showToast('Никнейм одобрен', 'success');
      };

      const handleAdminRejectNickname = async (uId) => {
        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uId), {
          nicknameStatus: 'rejected',
          nicknamePending: ''
        });
        showToast('Никнейм отклонен', 'warning');
      };

      const handleAdminBlockUser = async (uId) => {
        try {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uId), {
            isBanned: true
          });
          showToast('Пользователь заблокирован', 'success');
        } catch (e) {
          showToast('Пользователь не найден', 'error');
        }
      };

      const handleAdminUnblockUser = async (uId) => {
        try {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uId), {
            isBanned: false
          });
          showToast('Пользователь разблокирован', 'success');
        } catch (e) {
          showToast('Пользователь не найден', 'error');
        }
      };

      const handleAdminRestrictUser = async (uId) => {
        try {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uId), {
            isRestricted: true
          });
          showToast('Функции пользователя ограничены', 'success');
        } catch (e) {
          showToast('Пользователь не найден', 'error');
        }
      };

      const handleAdminUnrestrictUser = async (uId) => {
        try {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uId), {
            isRestricted: false
          });
          showToast('Ограничения сняты', 'success');
        } catch (e) {
          showToast('Пользователь не найден', 'error');
        }
      };

      const handleAdminSendWarning = async (uId, text) => {
        if (!text.trim()) return;
        try {
          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', uId), {
            warning: text
          });
          showToast('Предупреждение отправлено пользователю', 'success');
        } catch (e) {
          showToast('Ошибка отправки', 'error');
        }
      };

      const handleAdminGeneratePromo = async (type, duration) => {
        const code = `RE-${type.toUpperCase()}-${Math.random().toString(36).substring(2, 7).toUpperCase()}`;
        const sysRef = doc(db, 'artifacts', appId, 'public', 'data', 'system');
        const currentPromos = systemSettings.promoCodes || [];
        
        const newPromo = { code, type, duration };
        await updateDoc(sysRef, {
          promoCodes: [...currentPromos, newPromo]
        });
        showToast(`Создан промокод: ${code}`, 'success');
      };

      const handleAdminDeleteReview = async (reviewId) => {
        try {
          const rev = reviews.find(r => r.id === reviewId);
          if (!rev) return;
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'reviews', reviewId));
          
          // Пересчет рейтинга у пострадавшего
          const targetId = rev.targetUserId;
          const remainingReviews = reviews.filter(r => r.targetUserId === targetId && r.id !== reviewId);
          const totalRating = remainingReviews.reduce((sum, r) => sum + r.rating, 0);
          const avgRating = remainingReviews.length > 0 ? Number((totalRating / remainingReviews.length).toFixed(2)) : 5.0;

          await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'users', targetId), {
            rating: avgRating,
            reviewsCount: remainingReviews.length
          });

          showToast('Отзыв удален, рейтинг пересчитан', 'success');
        } catch (e) {
          showToast('Ошибка удаления отзыва', 'error');
        }
      };

      // Переключатель темы
      const toggleTheme = () => {
        const next = theme === 'dark' ? 'light' : 'dark';
        setTheme(next);
        localStorage.setItem('relook_theme', next);
        if (next === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      // Прослушивание новых сообщений для кастомного тоста-уведомления
      useEffect(() => {
        if (!user || messages.length === 0) return;
        const lastMsg = messages[messages.length - 1];
        
        // Показываем уведомление, если:
        // 1. Сообщение отправлено не нами
        // 2. Чат не приглушен нами (mutedBy)
        // 3. Сообщение свежее (создано менее 5 сек назад)
        if (lastMsg.senderId !== user.uid && (Date.now() - lastMsg.timestamp < 5000)) {
          const associatedChat = chats.find(c => c.id === lastMsg.chatId);
          if (associatedChat && !associatedChat.mutedBy?.includes(user.uid)) {
            // Показываем уведомление справа вверху
            showToast(`Новое сообщение от ${lastMsg.senderNickname}: "${lastMsg.text}"`, 'message');
          }
        }
      }, [messages]);

      // --- РЕНДЕРИНГ ЭКРАНОВ БЛОКИРОВКИ ---

      if (loading) {
        return (
          div class="min-h-screen bg-forest-900 flex flex-col items-center justify-center text-white">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-emerald-500 mb-4"></div>
            <p class="text-emerald-400 font-semibold tracking-wider">Загрузка Relook...</p>
          </div>
        );
      }

      // Экран полной блокировки (БАН)
      if (authStep === 'banned') {
        return (
          <div class="fixed inset-0 z-50 bg-black/90 flex flex-col items-center justify-center p-4 text-center">
            <div class="bg-zinc-900 border border-red-500 p-8 rounded-2xl max-w-md w-full shadow-2xl space-y-6">
              <div class="w-20 h-20 bg-red-500/10 border border-red-500 rounded-full flex items-center justify-center mx-auto text-red-500">
                <i data-lucide="shield-alert" class="w-10 h-10"></i>
              </div>
              <h1 class="text-2xl font-bold text-red-500">Ваш аккаунт заблокирован</h1>
              <p class="text-zinc-400 text-sm leading-relaxed">
                Администрация площадки Relook заблокировала ваш профиль за нарушение правил или подозрительную активность. Блокировка вечная и обжалованию не подлежит.
              </p>
              <button 
                onClick={handleLogout}
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition duration-150"
              >

                      class="w-full bg-emerald-500 text-white py-3 rounded-2xl font-bold"
                    >
                      Дальше
                    </button>
                  </div>
                )}

                {/* Шаг 2: Прикрепить фото */}
                {createStep === 2 && (
                  <div class="space-y-4">
                    <label class="block text-xs font-semibold text-zinc-400 uppercase">Ссылка на фотографию товара</label>
                    <input 
                      type="text"
                      placeholder="Вставьте URL фотографии товара"
                      value={newListing.images[0]}
                      onChange={(e) => setNewListing({ ...newListing, images: [e.target.value] })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-2xl text-sm"
                    />
                    <div class="bg-emerald-50 dark:bg-emerald-950/10 p-3 rounded-2xl text-[10px] text-emerald-500">
                      Для прототипа вы можете вставить любую картинку из интернета (Unsplash).
                    </div>
                    <div class="flex gap-2">
                      <button onClick={() => setCreateStep(1)} class="w-1/2 bg-zinc-800 py-3 rounded-2xl font-bold text-xs">Назад</button>
                      <button 
                        onClick={() => { if (newListing.images[0].trim()) setCreateStep(3); }}
                        class="w-1/2 bg-emerald-500 text-white py-3 rounded-2xl font-bold text-xs"
                      >
                        Дальше
                      </button>
                    </div>
                  </div>
                )}

                {/* Шаг 3: Состояние */}
                {createStep === 3 && (
                  <div class="space-y-4">
                    <label class="block text-xs font-semibold text-zinc-400 uppercase">Шкала состояния вещи</label>
                    <div class="grid grid-cols-2 gap-2">
                      {['Новое с биркой', 'Отличное', 'Хорошее', 'Удовлетворительное'].map((cond) => (
                        <button 
                          key={cond}
                          onClick={() => setNewListing({ ...newListing, condition: cond })}
                          class={`py-3.5 px-2.5 rounded-2xl text-xs font-bold transition border ${newListing.condition === cond ? 'bg-emerald-500 text-white border-emerald-400' : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-400 border-transparent'}`}
                        >
                          {cond}
                        </button>
                      ))}
                    </div>
                    <div class="flex gap-2">
                      <button onClick={() => setCreateStep(2)} class="w-1/2 bg-zinc-800 py-3 rounded-2xl font-bold text-xs">Назад</button>
                      <button onClick={() => setCreateStep(4)} class="w-1/2 bg-emerald-500 text-white py-3 rounded-2xl font-bold text-xs">Дальше</button>
                    </div>
                  </div>
                )}

                {/* Шаг 4: Цвет */}
                {createStep === 4 && (
                  <div class="space-y-4">
                    <label class="block text-xs font-semibold text-zinc-400 uppercase">Цвет вещи</label>
                    <input 
                      type="text"
                      placeholder="Например, Черный"
                      value={newListing.color}
                      onChange={(e) => setNewListing({ ...newListing, color: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-2xl text-sm"
                    />
                    <div class="flex gap-2">
                      <button onClick={() => setCreateStep(3)} class="w-1/2 bg-zinc-800 py-3 rounded-2xl font-bold text-xs">Назад</button>
                      <button onClick={() => setCreateStep(5)} class="w-1/2 bg-emerald-500 text-white py-3 rounded-2xl font-bold text-xs">Дальше</button>
                    </div>
                  </div>
                )}

                {/* Шаг 5: Цена и Галочка "Оригинал" */}
                {createStep === 5 && (
                  <div class="space-y-4">
                    <div>
                      <label class="block text-xs font-semibold text-zinc-400 uppercase mb-2">Цена (₽)</label>
                      <input 
                        type="number"
                        placeholder="Например, 15000"
                        value={newListing.price}
                        onChange={(e) => setNewListing({ ...newListing, price: e.target.value })}
                        class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-2xl text-sm"
                      />
                    </div>
                    
                    {/* Галочка оригинал */}
                    <div class="flex items-center gap-3 p-3 bg-zinc-100 dark:bg-zinc-800 rounded-2xl">
                      <input 
                        type="checkbox"
                        id="isOriginalCheck"
                        checked={newListing.isOriginal}
                        onChange={(e) => setNewListing({ ...newListing, isOriginal: e.target.checked })}
                        class="w-5 h-5 rounded text-emerald-500"
                      />
                      <label for="isOriginalCheck" class="text-xs font-bold cursor-pointer">
                        Оригинальный товар (нужна подписка RePlus / RePremium)
                      </label>
                    </div>

                    <div class="flex gap-2">
                      <button onClick={() => setCreateStep(4)} class="w-1/2 bg-zinc-800 py-3 rounded-2xl font-bold text-xs">Назад</button>
                      <button onClick={() => setCreateStep(6)} class="w-1/2 bg-emerald-500 text-white py-3 rounded-2xl font-bold text-xs">Дальше</button>
                    </div>
                  </div>
                )}

                {/* Шаг 6: Описание */}
                {createStep === 6 && (
                  <div class="space-y-4">
                    <label class="block text-xs font-semibold text-zinc-400 uppercase">Подробное описание товара</label>
                    <textarea 
                      placeholder="Опишите дефекты, замеры, бирки и швы..."
                      rows="4"
                      value={newListing.description}
                      onChange={(e) => setNewListing({ ...newListing, description: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-2xl text-sm"
                    ></textarea>
                    <div class="flex gap-2">
                      <button onClick={() => setCreateStep(5)} class="w-1/2 bg-zinc-800 py-3 rounded-2xl font-bold text-xs">Назад</button>
                      <button 
                        onClick={handleCreateListing}
                        class="w-1/2 bg-emerald-500 text-white py-3 rounded-2xl font-bold text-xs"
                      >
                        Опубликовать
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          )}

          {/* --- МОДАЛЬНОЕ ОКНО ОПЛАТЫ / ПРОМОКОДА --- */}
          {showPromoModal && (
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div class="bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 p-8 rounded-3xl max-w-md w-full space-y-6 shadow-2xl relative">
                <button 
                  onClick={() => { setShowPromoModal(false); setPromoSuccessMsg(''); }}
                  class="absolute top-4 right-4 text-zinc-500 hover:text-white"
                >
                  <i data-lucide="x" class="w-6 h-6"></i>
                </button>

                <h3 class="text-xl font-bold text-center">Выберите метод оплаты</h3>

                <div class="grid grid-cols-2 gap-3">
                  <button 
                    onClick={() => showToast('Этот метод оплаты временно недоступен, используйте другой.', 'warning')}
                    class="bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 p-4 rounded-2xl flex flex-col items-center gap-2 text-center"
                  >
                    <i data-lucide="credit-card" class="w-6 h-6 text-emerald-500"></i>
                    <span class="text-xs font-bold">Банковская карта</span>
                  </button>
                  <button 
                    class="bg-emerald-500/20 border border-emerald-500 p-4 rounded-2xl flex flex-col items-center gap-2 text-center"
                  >
                    <i data-lucide="ticket" class="w-6 h-6 text-emerald-500"></i>
                    <span class="text-xs font-bold">Промокод подписки</span>
                  </button>
                </div>

                <div class="space-y-3 pt-4 border-t border-gray-100 dark:border-zinc-800">
                  <label class="block text-xs font-bold uppercase text-zinc-400">Введите промокод</label>
                  <div class="flex gap-2">
                    <input 
                      type="text"
                      placeholder="RE-REPREMIUM-XXXXX"
                      value={promoInput}
                      onChange={(e) => setPromoInput(e.target.value)}
                      class="flex-grow bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm uppercase"
                    />
                    <button 
                      onClick={handleApplyPromo}
                      class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-bold"
                    >
                      Активировать
                    </button>
                  </div>
                  {promoSuccessMsg && (
                    <div class="bg-emerald-500/10 border border-emerald-500 text-emerald-500 text-xs p-3 rounded-xl text-center font-bold">
                      {promoSuccessMsg}
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* --- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ПРОФИЛЯ --- */}
          {showEditProfileModal && (
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <form onSubmit={handleSaveProfile} class="bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 p-8 rounded-3xl max-w-md w-full space-y-6 shadow-2xl relative">
                <button 
                  type="button"
                  onClick={() => setShowEditProfileModal(false)}
                  class="absolute top-4 right-4 text-zinc-500 hover:text-white"
                >
                  <i data-lucide="x" class="w-6 h-6"></i>
                </button>

                <h3 class="text-lg font-bold">Редактирование профиля</h3>

                <div class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Изменить никнейм</label>
                    <input 
                      type="text"
                      value={editProfileForm.nickname}
                      onChange={(e) => setEditProfileForm({ ...editProfileForm, nickname: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm"
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Ссылка на новую аватарку</label>
                    <input 
                      type="text"
                      value={editProfileForm.avatarUrl}
                      onChange={(e) => setEditProfileForm({ ...editProfileForm, avatarUrl: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm"
                    />
                    <p class="text-[9px] text-zinc-500 mt-1">
                      * Смена аватарки доступна только подписчикам RePlus и RePremium. Изменения проходят модерацию.
                    </p>
                  </div>
                </div>

                <button 
                  type="submit"
                  class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm"
                >
                  Отправить изменения
                </button>
              </form>
            </div>
          )}

          {/* --- МОДАЛЬНОЕ ОКНО ОТЗЫВА --- */}
          {showReviewModal && (
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <form onSubmit={handleAddReview} class="bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 p-8 rounded-3xl max-w-md w-full space-y-6 shadow-2xl relative">
                <button 
                  type="button"
                  onClick={() => setShowReviewModal(false)}
                  class="absolute top-4 right-4 text-zinc-500 hover:text-white"
                >
                  <i data-lucide="x" class="w-6 h-6"></i>
                </button>

                <h3 class="text-lg font-bold">Оцените сделку</h3>

                <div class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Оценка звездами (от 1 до 5)</label>
                    <select 
                      value={reviewForm.rating}
                      onChange={(e) => setReviewForm({ ...reviewForm, rating: Number(e.target.value) })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm"
                    >
                      {[5, 4, 3, 2, 1].map(n => <option key={n} value={n}>{n} ★</option>)}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Сделка состоялась?</label>
                    <select 
                      value={reviewForm.dealSuccess}
                      onChange={(e) => setReviewForm({ ...reviewForm, dealSuccess: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm"
                    >
                      <option value="yes">Да, всё прошло отлично</option>
                      <option value="no">Нет, сделка сорвалась</option>
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Текст отзыва</label>
                    <textarea 
                      rows="3"
                      placeholder="Напишите честный отзыв о продавце..."
                      value={reviewForm.text}
                      onChange={(e) => setReviewForm({ ...reviewForm, text: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm"
                    ></textarea>
                  </div>
                </div>

                <button 
                  type="submit"
                  class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm"
                >
                  Опубликовать отзыв
                </button>
              </form>
            </div>
          )}

          {/* --- МОДАЛЬНОЕ ОКНО ЖАЛОБЫ (REPORT) --- */}
          {showReportModal && (
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <form onSubmit={handleSendReport} class="bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 p-8 rounded-3xl max-w-md w-full space-y-6 shadow-2xl relative">
                <button 
                  type="button"
                  onClick={() => setShowReportModal(false)}
                  class="absolute top-4 right-4 text-zinc-500 hover:text-white"
                >
                  <i data-lucide="x" class="w-6 h-6"></i>
                </button>

                <h3 class="text-lg font-bold">Отправить жалобу в поддержку</h3>

                <div class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">ID сообщения / чата</label>
                    <input 
                      type="text"
                      readOnly
                      value={reportForm.messageId}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-xs text-zinc-500"
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Опишите проблему</label>
                    <textarea 
                      rows="4"
                      required
                      placeholder="Опишите факт увода в сторонний мессенджер, оскорбления или подозрения в подделке..."
                      value={reportForm.reason}
                      onChange={(e) => setReportForm({ ...reportForm, reason: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm"
                    ></textarea>
                  </div>
                </div>

                <button 
                  type="submit"
                  class="w-full bg-red-600 text-white py-3 rounded-xl font-bold text-sm"
                >
                  Отправить модераторам
                </button>
              </form>
            </div>
          )}

          {/* --- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ОБЪЯВЛЕНИЯ --- */}
          {showEditModal && editingListing && (
            <div class="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
              <div class="bg-white dark:bg-zinc-900 border border-gray-100 dark:border-zinc-800 p-8 rounded-3xl max-w-md w-full space-y-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button 
                  onClick={() => setShowEditModal(false)}
                  class="absolute top-4 right-4 text-zinc-500 hover:text-white"
                >
                  <i data-lucide="x" class="w-6 h-6"></i>
                </button>

                <h3 class="text-lg font-bold">Редактировать товар</h3>

                <div class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Название</label>
                    <input 
                      type="text"
                      value={editingListing.title}
                      onChange={(e) => setEditingListing({ ...editingListing, title: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm"
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Цена (₽)</label>
                    <input 
                      type="number"
                      value={editingListing.price}
                      onChange={(e) => setEditingListing({ ...editingListing, price: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm"
                    />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-zinc-400 uppercase mb-2">Описание</label>
                    <textarea 
                      rows="3"
                      value={editingListing.description}
                      onChange={(e) => setEditingListing({ ...editingListing, description: e.target.value })}
                      class="w-full bg-zinc-100 dark:bg-zinc-800 p-3 rounded-xl text-sm"
                    ></textarea>
                  </div>
                </div>

                <button 
                  onClick={handleSaveEditedListing}
                  class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold text-sm"
                  Сохранить изменения
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Рендер в DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Триггер Lucide-иконок после рендеринга
    setTimeout(() => {
      lucide.createIcons();
    }, 1500);

    // Дополнительный интервал на перерисовку иконок при динамических изменениях в React
    setInterval(() => {
      lucide.createIcons();
    }, 2000);

  </script>
</body>
</html>
